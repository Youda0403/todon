let peopleCache = {acct:null, list:null};
async function myPeople(){
  const me = cur();
  if (peopleCache.acct === me.acct && peopleCache.list) return peopleCache.list;
  const grab = async path => {
    const out = []; let p = path;
    for (let i = 0; i < 3 && p; i++){ const {data, next} = await api(p, {withLink:true}); out.push(...data); p = data.length ? next : null; }
    return out;
  };
  const [following, followers] = await Promise.all([
    grab(`/api/v1/accounts/${me.id}/following?limit=80`),
    grab(`/api/v1/accounts/${me.id}/followers?limit=80`).catch(() => [])
  ]);
  const fb = new Set(followers.map(x => String(x.id)));
  const list = following.map(x => ({a:x, mutual:fb.has(String(x.id))})).sort((x, y) => (y.mutual - x.mutual));
  peopleCache = {acct:me.acct, list};
  return list;
}
function newDmSheet(){
  sheet((sh, close) => {
    sh.append(h('<h3>새 쪽지</h3>'));
    const f = h('<div class="field" style="padding:0 20px 4px"><input type="search" placeholder="이름이나 아이디로 찾기" autocapitalize="off" autocorrect="off" spellcheck="false"></div>');
    const res = document.createElement('div');
    res.innerHTML = '<div class="sentinel"><div class="spin"></div></div>';
    sh.append(f, res);
    const inp = $('input', f); let tmr = null, seq = 0, people = [];
    const row = (a, mutual) => {
      const nm = document.createElement('span'); nm.append(richName(a));
      if (mutual) nm.append(h('<span class="mutual">맞팔</span>'));
      const b = optBtn('<img class="av" alt="">', nm, '@' + a.acct, false);
      $('img', b).src = avOf(a);
      b.onclick = () => { close(); startChat([a]); };
      return b;
    };
    const section = (title, items) => {
      if (!items.length) return;
      res.append(h(`<div class="psec">${esc(title)}</div>`));
      items.forEach(x => res.append(row(x.a, x.mutual)));
    };
    const show = (others) => {
      const q = inp.value.trim().toLowerCase().replace(/^@/, '');
      const hit = x => !q || (x.a.display_name || '').toLowerCase().includes(q) || x.a.acct.toLowerCase().includes(q);
      const mine = people.filter(hit);
      res.replaceChildren();
      section('맞팔', mine.filter(x => x.mutual));
      section('내가 팔로우하는 사람', mine.filter(x => !x.mutual));
      if (others && others.length) section('그 밖의 사람', others.map(a => ({a, mutual:false})));
      if (!res.childElementCount) res.append(h(`<p class="secdesc" style="padding:8px 20px 16px">${q ? '내가 팔로우하는 사람 중에는 없어요. 다른 서버 사람은 아이디@서버주소로 적어 주세요.' : '아직 팔로우하는 사람이 없어요. 이름이나 아이디로 찾아 보세요.'}</p>`));
    };
    myPeople().then(list => { people = list; show(); }).catch(e => { res.replaceChildren(); toast(e.message); });
    inp.oninput = () => {
      clearTimeout(tmr);
      show();
      const q = inp.value.trim();
      if (q.replace(/^@/, '').length < 2) return;
      tmr = setTimeout(async () => {
        const my = ++seq;
        try{
          const [fol, all] = await Promise.all([
            api('/api/v1/accounts/search?' + qs({q, following:'true', limit:'20'})).catch(() => []),
            api('/api/v1/accounts/search?' + qs({q, resolve:'true', limit:'8'})).catch(() => [])
          ]);
          if (my !== seq) return;
          const known = new Set(people.map(x => String(x.a.id)));
          fol.forEach(a => { if (!known.has(String(a.id))){ people.push({a, mutual:false}); known.add(String(a.id)); } });
          const others = all.filter(a => !known.has(String(a.id)) && String(a.id) !== String(cur().id)).slice(0, 5);
          show(others);
        }catch(e){}
      }, 350);
    };
    setTimeout(() => inp.focus(), 100);
  });
}

  if (tab.t === 'tag') return '#/tag/' + encodeURIComponent(tab.tag);
  return '#/' + tab.t;
}
const TAB_INFO = {
  home:['팔로잉', '내가 팔로우한 사람들의 글'],
  homeposts:['팔로잉 (툿만)', '팔로우한 사람들의 글 중 답글은 빼고 툿만'],
  local:['우리 서버', '같은 서버 사람들의 공개 글 전부'],
  fed:['모든 서버', '연결된 다른 서버의 공개 글까지 전부'],
  bookmarks:['북마크', '내가 북마크한 글'],
  favs:['좋아요', '내가 좋아요를 누른 글']
};
const tabLabel = tab => tab.t === 'list' ? tab.title : tab.t === 'tag' ? '#' + tab.tag : TAB_INFO[tab.t][0];
function homeTarget(){
  const hs = homeTabs().map(tabHash);
  return lastHome && hs.includes(lastHome) ? lastHome : hs[0];
}
function renderHomeTabs(){
  const box = $('#tTabs'); if (!cur()) return;
  const sig = cur().acct + JSON.stringify(homeTabs());
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig; box.replaceChildren();
  homeTabs().forEach(tab => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.h = tabHash(tab); b.textContent = tabLabel(tab);
    b.onclick = () => {
      if (curKey === b.dataset.h){ if (window.scrollY > 10) window.scrollTo({top:0, behavior:'smooth'}); else floatRefresh(); }
      else goTop(b.dataset.h);
    };
    box.append(b);
  });
}
function homeFilter(s){
  const st = s.reblog || s;
  if (st.visibility === 'direct') return false;
  if (!SET.homeBoosts && s.reblog) return false;
  if (!SET.homeReplies && st.in_reply_to_id && String(st.in_reply_to_account_id) !== String(st.account.id)) return false;
  return true;
}

/* ---------- 설정 도우미 ---------- */
function helpBtn(title, text){
  const b = h('<button class="qhelp" type="button" aria-label="설명 보기">?</button>');
  b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    sheet(sh => { sh.classList.add('helpsheet'); const t = document.createElement('h3'); t.textContent = title; const p = document.createElement('p'); p.textContent = text; sh.append(t, p); });
  };
  return b;
}
function linkRow(icon, title, sub, fn){
  const b = h(`<button class="srow" type="button"><span class="oi">${ic(icon)}</span><span class="t"><b></b><small></small></span><span class="chev">${ic('right')}</span></button>`);
  $('b', b).textContent = title; $('small', b).textContent = sub; b.onclick = fn;
  return b;
}
function toggleRow(title, sub, help, checked, onChange){
  const row = h('<label class="tg"><span class="t"><b></b><small></small></span><input type="checkbox"></label>');
  $('b', row).textContent = title; $('small', row).textContent = sub;
  if (help) $('b', row).after(helpBtn(title, help));
  const inp = $('input', row); inp.checked = !!checked;
  inp.onchange = async () => {
    inp.disabled = true;
    try{ await onChange(inp.checked); }catch(e){ inp.checked = !inp.checked; toast(e.message); }
    inp.disabled = false;
  };
  return row;
}
function choiceRow(title, sub, help, options, current, onChange){
  const row = h('<div class="chooser"><div class="ct"><b></b><small></small></div><div class="seg"></div></div>');
  $('b', row).textContent = title; $('small', row).textContent = sub || ''; if (!sub) $('small', row).remove();
  if (help) $('b', row).after(helpBtn(title, help));
  const seg = $('.seg', row);
  const paint = v => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  options.forEach(([v, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = String(v); b.textContent = label;
    b.onclick = async () => {
      const prev = seg.querySelector('.on'); paint(v);
      try{ await onChange(v); }catch(e){ toast(e.message); if (prev) paint(prev.dataset.v); }
    };
    seg.append(b);
  });
  paint(current);
  return row;
}
function secEl(title, desc){
  const sec = h('<section class="sec"><h3></h3></section>');
  $('h3', sec).textContent = title;
  if (desc){ const p = document.createElement('p'); p.className = 'secdesc'; p.textContent = desc; sec.append(p); }
  return sec;
}
/* 화면 다시 그리기 (설정이 바뀐 뒤 다른 화면에 반영) */
function resetViews(){ for (const k of [...cache.keys()]) if (k !== curKey) cache.delete(k); }
async function patchMe(fields){
  const fd = new FormData();
  Object.entries(fields).forEach(([k, v]) => fd.append(k, String(v)));
  const u = await api('/api/v1/accounts/update_credentials', {method:'PATCH', form:fd});
  toast('저장했어요');
  return u;
}
async function seedReadingPrefs(){
  if (!cur() || LS.get('ytt.set.seeded', false)) return;
  try{
    const p = await api('/api/v1/preferences');
    const saved = LS.get('ytt.set', {});
    if (!('cwOpen' in saved)) SET.cwOpen = !!p['reading:expand:spoilers'];
    if (!('media' in saved)) SET.media = p['reading:expand:media'] === 'show_all' ? 'show' : p['reading:expand:media'] === 'hide_all' ? 'hide' : 'default';
    if (!('anim' in saved) && p['reading:autoplay:gifs'] === false) SET.anim = false;
    LS.set('ytt.set', SET); LS.set('ytt.set.seeded', true); applySettings();
  }catch(e){}
}

      const {data, next} = await api(nextPath && !reset ? nextPath : `/api/v1/accounts/${id}/${kind}?limit=40`, {withLink:true});

      if (my !== gen) return;
      if (reset) list.replaceChildren();
      const rm = new Map(rels.map(r => [String(r.id), r]));
      data.forEach(a => list.append(row(a, rm.get(String(a.id)))));
      if (data.length && next){ nextPath = next; sent.innerHTML = ''; ok = true; }
      else {
        done = true;
        sent.innerHTML = list.childElementCount ? '' : `<div class="empty">${kind === 'followers' ? '아직 팔로워가 없어요.' : '아직 팔로우하는 사람이 없어요.'}<br>목록을 숨겨 둔 계정이라면 보이지 않을 수 있어요.</div>`;

  root.refresh = () => load(true);
  load(true);
  return root;
}

/* 사람 목록 (서버가 알려 주는 다음 주소로 계속 불러옴) */
function peopleList(path, empty){
  const root = document.createElement('div');
  const list = document.createElement('div'), sent = document.createElement('div'); sent.className = 'sentinel';
  root.append(list, sent);
  let nextPath = null, loading = false, done = false, gen = 0;
  const seen = new Set();
  async function load(reset){
    if (reset){ gen++; nextPath = null; done = false; loading = false; }
    if (loading || done) return;
    loading = true; const my = gen;
    if (!(reset && list.childElementCount)) sent.innerHTML = '<div class="spin"></div>';
    let ok = false;
    try{
      const {data, next} = await api(nextPath && !reset ? nextPath : path, {withLink:true});
      if (my !== gen) return;
      if (reset){ list.replaceChildren(); seen.clear(); }
      const fresh = (data || []).filter(a => !seen.has(String(a.id)));
      fresh.forEach(a => { seen.add(String(a.id)); list.append(personRow(a)); });
      if (fresh.length && next){ nextPath = next; sent.innerHTML = ''; ok = true; }
      else { done = true; sent.innerHTML = list.childElementCount ? '' : `<div class="empty">${esc(empty)}</div>`; }
    }catch(e){
      if (my !== gen) return;
      sent.innerHTML = '';
      const b = h('<div class="err"><p></p><button class="pill ghost" type="button">다시 시도</button></div>');
      $('p', b).textContent = e.message; $('button', b).onclick = () => load(reset);
      sent.append(b);
    }finally{ if (my === gen) loading = false; }
    if (ok && root.isConnected && sent.getBoundingClientRect().top < innerHeight + 600) load(false);
  }
  new IntersectionObserver(es => { if (es[0].isIntersecting) load(false); }, {rootMargin:'600px 0px'}).observe(sent);
  root.refresh = () => load(true);
  load(true);
  return root;
}

/* ---------- 역극 이미지 저장: 대화 글을 한 장의 그림으로 (상대 프사·이름·아이디 가리기) ---------- */
const SHOT_SET_KEY = 'ytt.shot';
/* 다른 서버 그림은 그대로 그리면 저장이 막혀서, 받아서 그림 (못 받으면 대신 표시) */
const shotImgCache = new Map();
function shotImg(url){
  if (!url) return Promise.resolve(null);
  if (shotImgCache.has(url)) return shotImgCache.get(url);
  /* 앱 화면에 이미 떠 있던 그림은 브라우저에 ‘허락 표시 없이’ 저장돼 있어서 그대로 쓰면 막힘 → 저장본을 건너뛰고 새로 받음 */
  const viaImg = () => new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = url.startsWith('data:') ? url : url + (url.includes('?') ? '&' : '?') + '_ytt=' + Date.now();
  });
  const p = fetch(url, {mode:'cors', credentials:'omit', cache:'reload'}).then(r => r.ok ? r.blob() : null).then(b => b ? new Promise(res => {
    const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = URL.createObjectURL(b);
  }) : null).catch(() => null).then(im => im || viaImg());
  shotImgCache.set(url, p);
  return p;
}
function shotText(st){
  /* 본문 HTML → 문단·줄바꿈을 살린 글자 */
  const d = new DOMParser().parseFromString('<div>' + String(st.content || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>\s*<p[^>]*>/gi, '\n\n') + '</div>', 'text/html');
  d.querySelectorAll('.invisible').forEach(x => x.remove());
  d.querySelectorAll('.ellipsis').forEach(x => x.append('…'));
  d.querySelectorAll('.quote-inline').forEach(x => x.remove());
  return (d.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}
async function renderShot(posts, opt, meIds){
  const S2 = 2, W = 600, PAD = 16, AV = 44, TX = PAD + AV + 12, TW = W - TX - PAD;
  const dark = opt.dark;
  const C = dark ? {bg:'#15181c', fg:'#e7e9ea', sub:'#8b98a5', line:'#2f3336', thread:'#425059', acc:'#8a8bff', mask:'#3a4047', cw:'#1c1f23'}
                 : {bg:'#ffffff', fg:'#0f1419', sub:'#536471', line:'#eff3f4', thread:'#cfd9de', acc:'#6364ff', mask:'#cfd9de', cw:'#f7f9f9'};
  const FONT = '"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
  try{ await document.fonts.ready; }catch(e){}
  const mc = document.createElement('canvas').getContext('2d');
  const font = (w, sz) => `${w} ${sz}px ${FONT}`;
  const isPartner = a => !meIds.has(String(a.id));
  const partnerNames = new Set();
  posts.forEach(st => { if (isPartner(st.account)){ partnerNames.add(st.account.username.toLowerCase()); partnerNames.add(st.account.acct.toLowerCase()); } (st.mentions || []).forEach(m => { if (!meIds.has(String(m.id))){ partnerNames.add(String(m.username).toLowerCase()); partnerNames.add(String(m.acct).toLowerCase()); } }); });
  /* 그림 준비 */
  const imgs = new Map();
  const want = [];
  posts.forEach(st => {
    if (!(isPartner(st.account) && opt.hideAv)) want.push(st.account.avatar_static || st.account.avatar);
    (st.emojis || []).concat(st.account.emojis || []).forEach(e => want.push(e.static_url || e.url));
    if (opt.media) (st.media_attachments || []).forEach(m => { if (m.type === 'image' || m.type === 'gifv' || m.type === 'video') want.push(m.preview_url || m.url); });
  });
  await Promise.all([...new Set(want)].map(async u => imgs.set(u, await shotImg(u))));
  const emo = st => Object.fromEntries([...(st.emojis || []), ...(st.account.emojis || [])].map(e => [e.shortcode, imgs.get(e.static_url || e.url)]));
  /* 글자를 줄로 나누기 (단어 단위, 너무 긴 단어는 글자 단위) */
  const LH = 23, FS = 15;
  function layout(text, emap){
    mc.font = font(400, FS);
    const lines = [];
    for (const para of text.split('\n')){
      let line = [], w = 0;
      const push = () => { lines.push(line); line = []; w = 0; };
      const words = para.split(/(\s+)/).filter(x => x !== '');
      if (!words.length){ lines.push([]); continue; }
      for (const word of words){
        /* @아이디 뒤에 붙은 조사(님, 에게 등)는 따로 떼어 가리지 않음 */
        const mm = /^(@[\w-]+(?:\.[\w-]+)*(?:@[\w-]+(?:\.[\w-]+)*)?)(.*)$/.exec(word);
        const toks = mm ? [{s:mm[1], k:'mention'}, {s:mm[2], k:'text'}].filter(x => x.s) : [{s:word, k:/^#/.test(word) ? 'tag' : /^https?:\/\//.test(word) ? 'link' : 'text'}];
        const parts = [];
        toks.forEach(tk => tk.s.split(/(:[A-Za-z0-9_]+:)/).filter(Boolean).forEach(p => {
          const m = /^:([A-Za-z0-9_]+):$/.exec(p);
          if (m && emap[m[1]]){ parts.push({t:'emoji', img:emap[m[1]], w:FS * 1.25}); return; }
          let masked = false;
          if (tk.k === 'mention' && opt.hideId){ const hd = p.replace(/^@/, '').toLowerCase(); masked = partnerNames.has(hd) || partnerNames.has(hd.split('@')[0]); }
          parts.push({t:tk.k, s:p, w:mc.measureText(p).width, masked});
        }));
        const ww = parts.reduce((n, p) => n + p.w, 0);
        if (/^\s+$/.test(word)){ if (line.length) { line.push({t:'space', w:mc.measureText(' ').width}); w += mc.measureText(' ').width; } continue; }
        if (w + ww <= TW){ line.push(...parts); w += ww; continue; }
        if (line.length && ww <= TW){ while (line.length && line[line.length - 1].t === 'space') line.pop(); push(); line.push(...parts); w = ww; continue; }
        /* 한 단어가 한 줄보다 길면 글자 단위로 */
        for (const p of parts){
          if (p.t === 'emoji'){ if (w + p.w > TW) push(); line.push(p); w += p.w; continue; }
          for (const ch of [...p.s]){ const cw = mc.measureText(ch).width; if (w + cw > TW) push(); const last = line[line.length - 1]; if (last && last.t === p.t && !last.masked && !p.masked){ last.s += ch; last.w += cw; } else line.push({t:p.t, s:ch, w:cw, masked:p.masked}); w += cw; }
        }
      }
      while (line.length && line[line.length - 1].t === 'space') line.pop();
      lines.push(line);
    }
    while (lines.length && !lines[lines.length - 1].length) lines.pop();
    return lines;
  }
  /* 글마다 높이 계산 */
  const blocks = posts.map((st, i) => {
    const em = emo(st);
    const cw = st.spoiler_text ? layout(st.spoiler_text, em) : null;
    const body = layout(shotText(st), em);
    const media = opt.media ? (st.media_attachments || []).map(m => imgs.get(m.preview_url || m.url)).filter(Boolean) : [];
    let h = 12 + 22;                               /* 위 여백 + 이름 줄 */
    if (cw) h += 8 + cw.length * LH + 16;          /* CW 상자 */
    if (body.length) h += 4 + body.length * LH;
    const mh = media.map(im => Math.min(320, Math.round(TW * im.height / im.width)));
    if (mh.length) h += mh.reduce((n, x) => n + x + 8, 0) + 4;
    h = Math.max(h + 12, 12 + AV + 12);
    const nx = posts[i + 1];
    return {st, em, cw, body, media, mh, h, joined:!!nx && String(nx.in_reply_to_id) === String(st.id)};
  });
  /* 너무 길면 여러 장으로 나눔 */
  const MAXH = 7000, pages = [];
  let cur = [], ch = 0;
  blocks.forEach(b => { if (cur.length && ch + b.h > MAXH){ pages.push(cur); cur = []; ch = 0; } cur.push(b); ch += b.h; });
  if (cur.length) pages.push(cur);
  const out = [];
  for (const pg of pages){
    const H = pg.reduce((n, b) => n + b.h, 0);
    const cv = document.createElement('canvas'); cv.width = W * S2; cv.height = H * S2;
    const c = cv.getContext('2d'); c.scale(S2, S2);
    c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
    c.textBaseline = 'alphabetic';
    let y = 0;
    pg.forEach((b, bi) => {
      const st = b.st, a = st.account, partner = isPartner(a);
      /* 이음선 */
      if (b.joined && bi < pg.length - 1){ c.fillStyle = C.thread; c.fillRect(PAD + AV / 2 - 1, y + 12 + AV + 4, 2, b.h - AV - 8); }
      if (bi > 0 && pg[bi - 1].joined){ c.fillStyle = C.thread; c.fillRect(PAD + AV / 2 - 1, y, 2, 10); }
      /* 프사 */
      const ax = PAD, ay = y + 12;
      c.save(); c.beginPath(); c.arc(ax + AV / 2, ay + AV / 2, AV / 2, 0, Math.PI * 2); c.closePath(); c.clip();
      const av = (partner && opt.hideAv) ? null : imgs.get(a.avatar_static || a.avatar);
      if (partner && opt.hideAv){ /* 가린 프사는 배경색 그대로 둠 */ }
      else if (av) c.drawImage(av, ax, ay, AV, AV);
      else {
        c.fillStyle = C.mask; c.fillRect(ax, ay, AV, AV);
        c.fillStyle = dark ? '#5b636b' : '#a8b5bd';
        c.beginPath(); c.arc(ax + AV / 2, ay + AV * .4, AV * .18, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(ax + AV / 2, ay + AV * 1.02, AV * .36, Math.PI, 0); c.fill();
      }
      c.restore();
      /* 이름 · 아이디 · 시간 */
      let x = TX, by = y + 12 + 17;
      const bar = (w) => { c.fillStyle = C.bg; c.fillRect(x, by - 13, w, 16); x += w + 6; };
      if (partner && opt.hideName) bar(64);
      else {
        c.font = font(700, FS); c.fillStyle = C.fg;
        const nm = (a.display_name || a.username).replace(/:[A-Za-z0-9_]+:/g, m => (b.em[m.slice(1, -1)] ? '\u0000' + m : m));
        for (const part of nm.split(/(\u0000:[A-Za-z0-9_]+:)/).filter(Boolean)){
          if (part[0] === '\u0000'){ const im = b.em[part.slice(2, -1)]; c.drawImage(im, x, by - 15, 18, 18); x += 19; }
          else { const t = part; if (x + c.measureText(t).width > W - PAD - 60){ let s = t; while (s && x + c.measureText(s + '…').width > W - PAD - 60) s = s.slice(0, -1); c.fillText(s + '…', x, by); x += c.measureText(s + '…').width; break; } c.fillText(t, x, by); x += c.measureText(t).width; }
        }
        x += 5;
      }
      c.font = font(400, FS); c.fillStyle = C.sub;
      if (partner && opt.hideId) bar(80);
      else { const t = '@' + a.acct; const room = W - PAD - x - (opt.time ? 70 : 0); let s = t; while (s.length > 2 && c.measureText(s).width > room) s = s.slice(0, -1); if (s !== t) s += '…'; c.fillText(s, x, by); x += c.measureText(s).width + 5; }
      if (opt.time){ c.fillStyle = C.sub; const d = new Date(st.created_at); const t = `· ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; c.fillText(t, Math.min(x, W - PAD - c.measureText(t).width), by); }
      let cy = y + 12 + 22;
      const drawLines = (lines, color) => {
        for (const ln of lines){
          cy += LH; let lx = TX;
          for (const p of ln){
            if (p.t === 'space'){ lx += p.w; continue; }
            if (p.t === 'emoji'){ c.drawImage(p.img, lx, cy - FS - 1, FS * 1.2, FS * 1.2); lx += p.w; continue; }
            if (p.masked){ c.fillStyle = C.bg; c.fillRect(lx, cy - 19, p.w, 18); lx += p.w; continue; }
            c.font = font(400, FS); c.fillStyle = (p.t === 'mention' || p.t === 'tag' || p.t === 'link') ? C.acc : color;
            c.fillText(p.s, lx, cy - 5); lx += p.w;
          }
        }
      };
      if (b.cw){
        cy += 8;
        const top = cy;
        c.fillStyle = C.cw; c.strokeStyle = C.line; c.lineWidth = 1;
        c.beginPath(); c.roundRect ? c.roundRect(TX - 4, top, TW + 8, b.cw.length * LH + 12, 10) : c.rect(TX - 4, top, TW + 8, b.cw.length * LH + 12); c.fill(); c.stroke();
        cy += 4; drawLines(b.cw, C.sub); cy += 12;
      }

const BACKUP_CSS = `.mst-backup-v4{max-width:600px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:#fff;border:1px solid #eff3f4;line-height:1.5}

function backupHtml(posts){
  const postMap = new Map(); posts.forEach(p => postMap.set(p.id, p));
  const rootCache = new Map();
  const getRootId = post => {
    if (rootCache.has(post.id)) return rootCache.get(post.id);
    let c = post; const seen = new Set();
    while (c.in_reply_to_id && postMap.has(c.in_reply_to_id) && !seen.has(c.in_reply_to_id)){ seen.add(c.in_reply_to_id); c = postMap.get(c.in_reply_to_id); }
    rootCache.set(post.id, c.id); return c.id;
  };
  const threadMap = new Map();
  posts.forEach(p => { const k = p.conversation_id || getRootId(p); if (!threadMap.has(k)) threadMap.set(k, []); threadMap.get(k).push(p); });
  threadMap.forEach(arr => arr.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)));
  const threads = [...threadMap.entries()].sort((a, b) => new Date(a[1][0].created_at) - new Date(b[1][0].created_at));
  const emojify = (s, list) => { (list || []).forEach(e => { s = s.split(':' + e.shortcode + ':').join('<img src="' + esc(e.url) + '" class="emoji" alt="' + esc(e.shortcode) + '"/>'); }); return s; };
  let body = '<div class="mst-backup-v4">';
  threads.forEach(([, tp], idx) => {
    const lastThread = idx === threads.length - 1;
    if (idx > 0) body += '<div class="mst-divider"></div>';
    tp.forEach((post, pi) => {
      const cls = (pi === tp.length - 1 && !lastThread) ? 'mst-post mst-post-thread-last' : 'mst-post';
      const content = emojify(post.content || '', post.emojis);
      const nm = emojify(esc((post.account && post.account.display_name) || ''), post.account && post.account.emojis);
      let media = '';
      if ((post.media_attachments || []).length){
        media += '<div class="mst-img">';
        post.media_attachments.forEach(m => { if (m.type === 'image') media += '<img src="' + esc(m.url) + '" loading="lazy" alt="attachment"/>'; });
        media += '</div>';
      }
      body += '<div class="' + cls + '"><div class="mst-avt"><img src="' + esc(post.account ? post.account.avatar : '') + '" alt="avatar"/></div><div class="mst-content"><div class="mst-meta"><span class="mst-dn">' + nm + '</span><span class="mst-acct">@' + esc(post.account ? post.account.acct : '') + '</span><span class="mst-date">' + esc(new Date(post.created_at).toLocaleDateString()) + '</span></div><div class="mst-text">' + content + '</div>' + media + '</div></div>';
    });
  });
  return body + '</div>';
}

function setupSwipe(){

    if (t.clientX < 16 || t.clientX > innerWidth - 16 || e.target.closest('input,textarea,video,audio,.seg')) return;
    g = {x0:t.clientX, y0:t.clientY, lock:false, dx:0, vx:0, lx:t.clientX, lt:performance.now()};
  }, {passive:true});
  main.addEventListener('touchmove', e => {
    if (!g) return;

    if (!g.lock){
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dx) <= Math.abs(dy) * 1.2){ g = null; return; }
      const ctx = swipeCtx();
      if (!ctx || !startDrag(g, ctx)){ g = null; return; }

function startDrag(g, ctx){

    g.i = ctx.list.indexOf(curKey);
    if (g.i < 0) return false;
    g.cur = $('#main').firstElementChild;
  } else {
    g.ks = ctx.box._keys || ['posts', 'replies']; g.ki = g.ks.indexOf(ctx.box._tab());
    if (g.ki < 0) return false;
    g.cur = [...ctx.box.children].find(c => !c.hidden && !c.classList.contains('ptabs'));

}
function neighborOf(g, dir){
  if (dir in g.nb) return g.nb[dir];

  if (j < 0 || j >= g.ctx.list.length){ g.nb[dir] = null; return null; }
  const hash = g.ctx.list[j], e = viewFor(hash);

  wrap.style.cssText = `left:${g.left}px;width:${g.w}px;top:${$('#top').getBoundingClientRect().bottom}px;transform:translateX(${dir * g.w}px)`;
  const inner = document.createElement('div'); inner.style.transform = `translateY(${-(e.y || 0)}px)`;
  inner.append(e.el); wrap.append(inner); document.body.append(wrap);

}
function moveDrag(g){
  let dx = g.dx;

    if (nb){ nb.wrap.style.visibility = 'visible'; nb.wrap.style.transform = `translateX(${dx + dir * g.w}px)`; }
  } else {
    const can = (dx < 0 && g.ki < g.ks.length - 1) || (dx > 0 && g.ki > 0);

function endDrag(g){

    const dir = dx < 0 ? 1 : -1, nb = g.nb[dir];

    g.cur.style.transition = ease;
    g.cur.style.transform = `translateX(${commit ? -dir * w : 0}px)`;
    if (nb){ nb.wrap.style.transition = ease; nb.wrap.style.transform = `translateX(${commit ? 0 : dir * w}px)`; }
    setTimeout(() => {
      g.cur.style.transition = ''; g.cur.style.transform = '';

    }, dur + 10);
  } else {
    const dirK = dx < 0 ? 1 : -1, k = g.ks[g.ki + dirK];

      g.cur.style.transition = ''; g.cur.style.transform = '';
      g.ctx.box._showTab(k);
      const nv = [...g.ctx.box.children].find(c => !c.hidden && !c.classList.contains('ptabs'));
      if (nv && nv.animate) nv.animate([{transform:`translateX(${dirK * w * 0.6}px)`}, {transform:'none'}], {duration:dur, easing:'cubic-bezier(.2,.8,.3,1)'});
    } else {
      g.cur.style.transition = ease; g.cur.style.transform = '';
      setTimeout(() => { g.cur.style.transition = ''; }, dur + 10);
    }
  }
}

/* ---------- 당겨서 새로고침 ---------- */
/* 새로고침 표시: 목록을 밀지 않고, 화면 위에 떠 있는 동그란 아이콘 하나로만 보여 줌 */
let ptrBusy = false, spinCount = 0, spinT0 = 0, spinHideTimer = 0, ptrInd = null;
const SPIN_EASE = 'transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s';
function spinStart(){
  if (!ptrInd) return;
  spinCount++; ptrBusy = true; clearTimeout(spinHideTimer);
  if (spinCount > 1) return;
  spinT0 = Date.now();
  ptrInd.style.transition = SPIN_EASE; ptrInd.firstElementChild.style.transform = '';
  ptrInd.classList.add('spinning');
  ptrInd.style.transform = 'translate(-50%, 56px)'; ptrInd.style.opacity = '1';
}
function spinEnd(){
  if (!ptrInd || spinCount === 0) return;
  if (--spinCount > 0) return;
  spinHideTimer = setTimeout(() => {
    if (spinCount) return;
    ptrInd.style.transition = SPIN_EASE;
    ptrInd.style.transform = 'translate(-50%, 20px) scale(.5)'; ptrInd.style.opacity = '0';
    spinHideTimer = setTimeout(() => { if (spinCount) return; ptrInd.classList.remove('spinning'); ptrInd.style.transition = 'none'; ptrInd.style.transform = ''; ptrBusy = false; }, 300);
  }, Math.max(0, 450 - (Date.now() - spinT0)));
}
/* 새 버전이 있는지 서비스 워커에게 확인 부탁 (있으면 '새 버전이 있어요'가 뜸) */
function checkAppUpdate(){
  try{
    if (!('serviceWorker' in navigator)) return;
    const c = navigator.serviceWorker.controller; if (c) c.postMessage({type:'check'});
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  }catch(e){}
}
/* 지금 화면 새로고침 + 떠 있는 아이콘 (새로고침 버튼·당겨서 새로고침·탭 다시 누르기 모두) */
function floatRefresh(){
  checkAppUpdate();
  spinStart();
  Promise.race([Promise.resolve().then(refreshCurrent).catch(() => {}), sleep(10000)]).then(spinEnd);
}
function setupPTR(){
  const ind = ptrInd = h(`<div class="ptr">${ic('refresh')}</div>`); document.body.append(ind);
  const icon = ind.firstElementChild;
  let y0 = null, dy = 0;
  const blocked = () => ptrBusy || window.scrollY > 0 || document.querySelector('.ov,.cov,.lb') || document.body.classList.contains('in-login') || document.body.classList.contains('in-chat');
  window.addEventListener('touchstart', e => { if (blocked()){ y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; ind.style.transition = 'none'; }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    const d = Math.max(0, Math.min(dy * 0.5, 80));
    ind.style.transform = `translate(-50%, ${d}px)`;
    icon.style.transform = `rotate(${d * 4}deg)`;
    ind.style.opacity = String(Math.min(1, d / 60));
  }, {passive:true});
  window.addEventListener('touchend', () => {
    if (y0 == null) return;
    const go = dy * 0.5 >= 60 && window.scrollY <= 0;
    y0 = null; dy = 0;
    if (go){ floatRefresh(); return; }
    ind.style.transition = SPIN_EASE; ind.style.transform = ''; ind.style.opacity = '0';
  });
}

const seenKey = () => 'ytt.seen.' + cur().acct;
let pollTop = null, pollAcct = null, notifTop = null;
const shownIds = new Set();
let notifCount = 0, dmCount = 0, unread = new Map();
const badgeText = (n, plus) => n > 99 ? '99+' : n + (plus ? '+' : '');
function paintBadge(sel, n, plus){
  const b = $(`#bnav [data-n=${sel}] .badge`);
  b.hidden = !n; b.textContent = n ? badgeText(n, plus) : '';
}
function updAppBadge(){
  const t = notifCount + dmCount;
  try{ if (navigator.setAppBadge){ if (t) navigator.setAppBadge(t); else navigator.clearAppBadge(); } }catch(e){}
}
function setBadge(n, plus){ notifCount = Number(n) || 0; paintBadge('notifications', notifCount, plus); updAppBadge(); }
function setDmBadge(n){ dmCount = Number(n) || 0; paintBadge('dm', dmCount); updAppBadge(); }
function markSeen(id){
  if (LS.get(seenKey(), null) === id) return;
  LS.set(seenKey(), id);
  api('/api/v1/markers', {method:'POST', body:{notifications:{last_read_id:id}}}).catch(() => {});
}
async function checkNotif(){
  const acc = cur(); if (!acc) return;
  if (pollAcct !== acc.acct){ pollAcct = acc.acct; pollTop = null; notifTop = null; unread = new Map(); }
  try{
    const first = pollTop === null;
    const list = await api('/api/v1/notifications?' + qs(first ? {limit:'40'} : {since_id:pollTop, limit:'40'}));
    if (cur() !== acc) return;
    if (first){
      /* 다른 기기·앱에서 읽은 위치도 반영 */
      try{
        const mk = await api('/api/v1/markers?' + qs({'timeline[]':['notifications']}));
        const sid = mk && mk.notifications && mk.notifications.last_read_id;
        const ls = LS.get(seenKey(), null);
        if (sid && (!ls || cmpId(sid, ls) > 0)) LS.set(seenKey(), sid);
      }catch(e){}
    }
    if (list.length && (first || cmpId(list[0].id, pollTop) > 0)) pollTop = list[0].id;
    const nonDm = list.filter(n => !isDm(n));
    if (nonDm.length && (!notifTop || cmpId(nonDm[0].id, notifTop) > 0)) notifTop = nonDm[0].id;
    const {name} = parse();
    const onNotif = name === 'notifications' || name === 'mentions';
    let seen = LS.get(seenKey(), null);
    if (notifTop && (!seen || onNotif)){ markSeen(notifTop); seen = notifTop; }
    nonDm.forEach(n => { if (seen && cmpId(n.id, seen) > 0) unread.set(n.id, true); });
    for (const id of [...unread.keys()]) if (!seen || cmpId(id, seen) <= 0) unread.delete(id);
    if (onNotif) unread.clear();
    setBadge(unread.size, first && list.length >= 40 && unread.size >= nonDm.length);
    if (first) list.forEach(n => shownIds.add(n.id));
    else showNew(list);
  }catch(e){}
  checkDm();
}

/* ---------- 라우터 ---------- */
const HOME_NAMES = ['home','homeposts','local','fed','list','tag','bookmarks','favs'];
const TABS = [...HOME_NAMES, 'notifications','mentions','dm','me'];
const cache = new Map();
let curKey = null, lastTab = '#/home', lastNotifTab = '#/notifications', lastHome = null;
function parse(){
  const hsh = location.hash && location.hash !== '#' ? location.hash : (cur() ? tabHash(homeTabs()[0]) : '#/home');
  const [, name = 'home', arg, arg2] = hsh.slice(1).split('/');
  return {hsh, name, arg, arg2};
}
/* 화면 이동 기록 (history.state.d = 몇 번째 칸인지)
   0칸: 홈 탭 (팔로잉·우리 서버 등은 서로 바꿔 끼움) → 여기서 뒤로가기 = 앱 나가기
   1칸: 알림·쪽지·내 계정 탭 (서로 바꿔 끼움) → 뒤로가기 = 홈
   그 위: 글·프로필 같은 세부 화면이 쌓임 */
const depthOf = () => (history.state && typeof history.state.d === 'number') ? history.state.d : 0;
const isTop = hash => TABS.includes(hash.split('/')[1]);
const isHomeHash = hash => HOME_NAMES.includes(hash.split('/')[1]);
let navAfterPop = null, skipFade = false;
function goTop(hash){
  const d = depthOf();
  const finish = () => {
    if (isHomeHash(hash)) history.replaceState({d:0}, '', hash);
    else { history.replaceState({d:0}, '', homeTarget()); history.pushState({d:1}, '', hash); }
    route();
  };
  if (d === 0 && isHomeHash(hash)) finish();
  else if (d === 1 && !isHomeHash(hash) && !isHomeHash(location.hash || '#/home')){ history.replaceState({d:1}, '', hash); route(); }
  else if (d > 0){ navAfterPop = finish; history.go(-d); }
  else finish();
}
var freshNav = false;
function nav(hash){
  if (location.hash === hash) return;
  if (isTop(hash)){ goTop(hash); return; }
  history.pushState({d:depthOf() + 1}, '', hash);
  freshNav = true; route();
}
function goBack(){ if (depthOf() > 0) history.back(); else goTop(homeTarget()); }
function buildView(name, arg, arg2){
  switch (name){
    case 'home': return feedView('/api/v1/timelines/home', {hint:'내가 팔로우한 사람들의 글이 올라와요.', empty:'아직 글이 없어요. 커뮤 사람들을 팔로우해 보세요!', filter:homeFilter});
    /* 답글은 빼고 툿만 (자기 글에 이어 쓴 타래는 보임) — ‘홈에 답글 보이기’ 설정과 상관없이 */
    case 'homeposts': return feedView('/api/v1/timelines/home', {hint:'팔로우한 사람들의 글 중 답글은 빼고 툿만 보여요.', empty:'아직 글이 없어요.', filter:s => { const st = s.reblog || s; return homeFilter(s) && !(st.in_reply_to_id && String(st.in_reply_to_account_id) !== String(st.account.id)); }});
    case 'local': return feedView('/api/v1/timelines/public', {params:{local:'true'}, hint:'같은 서버(커뮤) 사람들이 올린 공개 글이 모두 모여요.', empty:'아직 이 서버에 공개 글이 없어요.'});
    case 'notifications': return feedView('/api/v1/notifications', {kind:'notif', empty:'아직 알림이 없어요.', filter:n => !isDm(n), limit:40});
    case 'mentions': return mentionsView();
    case 'fed': return feedView('/api/v1/timelines/public', {hint:'이 서버와 연결된 다른 서버의 공개 글까지 모두 보여요.', empty:'아직 글이 없어요.'});
    case 'list': return feedView(`/api/v1/timelines/list/${encodeURIComponent(arg)}`, {empty:'이 리스트에 아직 글이 없어요.'});
    case 'tag': return feedView(`/api/v1/timelines/tag/${encodeURIComponent(decodeURIComponent(arg))}`, {empty:'이 해시태그가 붙은 글이 아직 없어요.'});
    case 'bookmarks': return feedView('/api/v1/bookmarks', {empty:'북마크한 글이 없어요.', linkOnly:true});
    case 'favs': return feedView('/api/v1/favourites', {empty:'좋아요를 누른 글이 없어요.', linkOnly:true});
    case 'settings': return settingsView(arg);
    case 'dm': return dmListView();
    case 'chat': return chatView(arg);
    case 'edit': return editView();
    case 'thread': return threadView(arg);
    case 'user': return userView(arg);
    case 'follows': return followsView(arg, arg2 === 'followers' ? 'followers' : 'following');
    case 'htag': return tagView(decodeURIComponent(arg));
    case 'who': return whoView(arg, arg2);
    case 'shot': return shotView(arg);
    case 'backup': return backupView(arg);
    default: return meView();
  }
}
function route(){
  const fresh = freshNav; freshNav = false;
  const main = $('#main');
  let {hsh, name, arg, arg2} = parse();
  if (!cur() || name === 'login'){
    if (curKey && cache.has(curKey)) cache.get(curKey).y = window.scrollY;
    document.body.classList.add('in-login');
    main.replaceChildren(loginView(!!cur()));
    curKey = null; window.scrollTo(0, 0); return;
  }
  document.body.classList.remove('in-login');
  if (name === 'open'){ openNotif(arg, arg2); return; }
  if (![...TABS,'thread','user','chat','edit','settings','follows','htag','who','shot','backup'].includes(name) || (['thread','user','chat','list','tag','follows','htag','who','shot'].includes(name) && !arg)){ hsh = '#/home'; name = 'home'; }
  if (curKey && cache.has(curKey)) cache.get(curKey).y = window.scrollY;
  if (name === 'edit' || name === 'settings') cache.delete(hsh);
  /* 뒤로가기가 아니라 눌러서 새로 들어온 세부 화면(글·프로필 등)은 예전에 만들어 둔 것을 쓰지 않고 새로 만듦 */
  if (fresh && !TABS.includes(name)) cache.delete(hsh);
  const existed = cache.has(hsh);
  let e = cache.get(hsh);
  if (!e){ e = {el:buildView(name, arg, arg2), y:0}; }
  cache.delete(hsh); cache.set(hsh, e);
  while (cache.size > 15){ const k = [...cache.keys()].find(k => !TABS.includes(k.slice(2)) && k !== hsh); if (!k) break; cache.delete(k); }
  main.replaceChildren(e.el);
  if (!skipFade && e.el.animate) e.el.animate([{opacity:0}, {opacity:1}], {duration:180, easing:'ease-out'});
  skipFade = false;
  curKey = hsh;
  if (TABS.includes(name)) lastTab = hsh;
  if (HOME_NAMES.includes(name)) lastHome = hsh;
  if (name === 'notifications' || name === 'mentions') lastNotifTab = hsh;
  setHeader(name, e.el);
  updateTimes(e.el);
  if (name === 'notifications' || name === 'mentions'){ setBadge(false); checkNotif(); }
  if (existed && (name === 'dm' || name === 'chat') && e.el.refresh) e.el.refresh();
  const y = e.y; window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y));
}
function refreshCurrent(){
  const e = cache.get(curKey); if (!e || !e.el.refresh) return;

    } else toast('로그인을 취소했어요');
  }
  /* 뒤로가기 때 브라우저가 스크롤을 제멋대로 되돌리면, 앱이 화면마다 기억하는 위치가 다른 화면 값으로 덮여 버림 → 스크롤 위치는 앱이 직접 관리 */
  try{ history.scrollRestoration = 'manual'; }catch(e){}
  window.addEventListener('hashchange', () => { if (location.hash !== curKey) route(); });
  /* 처음 열 때: 맨 아래 칸이 홈이 되도록 정리 (알림을 눌러 바로 세부 화면이 열린 경우 포함) */
  const h0 = location.hash;
  if (cur() && depthOf() === 0 && h0 && h0 !== '#' && !isHomeHash(h0) && !/^#\/(login|open)/.test(h0)){
    history.replaceState({d:0}, '', homeTarget());
    history.pushState({d:1}, '', h0);
  }
  route();
  /* 타임라인을 먼저 불러오고, 알림·설정 확인은 조금 뒤에 */
  setTimeout(() => { seedReadingPrefs(); checkNotif(); checkPush(); }, 1200);
  setInterval(checkNotif, 30000);
  setInterval(() => checkPush(), 300000);
  setInterval(() => updateTimes($('#main')), 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkNotif(); checkPush(); updateTimes($('#main')); } });
  window.addEventListener('online', () => checkPush({force:true}));
  setupPTR();
  setupSwipe();
  shareAccountsWithSW();
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').then(() => checkPush()).catch(() => {});
    navigator.serviceWorker.addEventListener('message', onSwMessage);
  }
}
init();
</script>
</body>
</html>
