<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="역극툿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>역극툿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--fg:#0f1419;--sub:#536471;--line:#eff3f4;--hover:#f7f9f9;--accent:#6364ff;--accent-fg:#fff;--accent-soft:#efefff;--boost:#00ba7c;--fav:#f91880;--danger:#f4212e;--shadow:0 8px 28px rgba(0,0,0,.12);--glass:rgba(255,255,255,.86)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181c;--fg:#e7e9ea;--sub:#8b98a5;--line:#2f3336;--hover:#1c1f23;--accent:#8a8bff;--accent-fg:#fff;--accent-soft:#25264a;--shadow:0 8px 28px rgba(0,0,0,.5);--glass:rgba(21,24,28,.86)}}
:root[data-theme=dark]{--bg:#15181c;--fg:#e7e9ea;--sub:#8b98a5;--line:#2f3336;--hover:#1c1f23;--accent:#8a8bff;--accent-fg:#fff;--accent-soft:#25264a;--shadow:0 8px 28px rgba(0,0,0,.5);--glass:rgba(21,24,28,.86);color-scheme:dark}
:root{--post-fs:15px;--thread:#cfd9de}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--thread:#425059}}
:root[data-theme=dark]{--thread:#425059}
html{background:var(--bg);overscroll-behavior-y:none}
body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}
.sp{flex:1}

/* 뼈대 */
#shell{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
@media(min-width:640px){#shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
body.in-login #top,body.in-login .bnav,body.in-login .fab{display:none}
body.in-login #shell{padding-bottom:0;border:0}
.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-row{display:flex;align-items:center;gap:12px;height:53px;padding:0 10px 0 12px}
.top-row h1{flex:1;margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:50%;background:none;padding:0;flex:none}
.ibtn:active{background:var(--hover)}
.me-av{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;background:var(--line)}
.tabs{display:flex}
.tabs button{flex:1;border:0;background:none;padding:14px 0 13px;font-weight:600;color:var(--sub);position:relative}
.tabs button.on{color:var(--fg);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:4px;border-radius:2px;background:var(--accent)}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:6px 8px 6px 16px;border-bottom:1px solid var(--line);background:var(--hover)}
.hint span{flex:1}
.hint .ibtn{width:30px;height:30px}
.hint .ic{width:16px;height:16px}

/* 하단 내비 */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{max-width:600px;margin:0 auto;display:flex}
.bnav button{flex:1;border:0;background:none;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--sub);position:relative}
.bnav button .ic{width:24px;height:24px}
.bnav button.on{color:var(--fg);font-weight:700}
.bnav button.on .ic{stroke-width:2.4}
.badge{position:absolute;top:3px;left:calc(50% + 4px);display:flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#f4212e;color:#fff;font-style:normal;font-size:11px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;border:2px solid var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 284px));bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.fab .ic{width:24px;height:24px;stroke-width:2.2}

/* 공용 버튼 */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:8px 18px;text-decoration:none}
.pill:disabled{opacity:.45;cursor:default}
.pill.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.pill .ic{width:18px;height:18px}
.wide{width:100%}
.txtbtn{border:0;background:none;padding:8px 6px;font-weight:600}
.mini{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.mini.danger{color:var(--danger)}
.tag{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}

/* 글 카드 */
.status{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;scroll-margin-top:110px}
.status:not(.focus):active{background:var(--hover)}
.pre{display:flex;align-items:center;gap:6px;margin:-2px 0 4px;padding-left:28px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
/* 알림 카드 위 안내 줄: 화살표·글씨 모두 회색, 툿 이름이 시작하는 자리부터 */
.notif-card>.pre{gap:5px;margin:-2px 0 4px;padding-left:56px;font-weight:500;color:var(--sub);line-height:20px}
.notif-card>.pre .ic{width:15px;height:15px;color:var(--sub)}
.pre .ic{width:16px;height:16px}
.pre span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:12px}
.left{display:flex;flex-direction:column;align-items:center;flex:none}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.line{flex:1;width:2px;border-radius:1px;background:var(--thread);margin-top:4px;margin-bottom:-12px}
.status.up{border-bottom:0;padding-bottom:0}
.status.up .actions{padding-bottom:8px}
.body{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
.handle{color:var(--sub);overflow:hidden;text-overflow:ellipsis;flex-shrink:2;min-width:0}
.dot,.time,.vis{color:var(--sub);flex:none}
.vis{display:inline-flex}
.vis .ic{width:14px;height:14px}
.replyto{display:flex;align-items:center;gap:4px;margin:1px 0 2px;color:var(--sub);font-size:13.5px;font-weight:500;max-width:100%;cursor:pointer;line-height:1.5}
.replyto .ic{width:14px;height:14px;stroke-width:2;flex:none}
.replyto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replyto b{color:var(--accent);font-weight:600}
.status.focus .replyto,.status.up .replyto{cursor:default}
.content{margin-top:2px;overflow-wrap:anywhere;word-break:break-word}
.status .content,.bub .content,.qcontent{font-size:var(--post-fs)}
body.no-counts .act span{display:none}
.content p{margin:0 0 .65em}
.content p:last-child{margin:0}
.content a{color:var(--accent);text-decoration:none}
.content .invisible{display:none}
.content .ellipsis::after{content:"…"}
img.emoji{height:1.25em;width:auto;vertical-align:-.25em;margin:0 .05em;object-fit:contain}
.cwbox{display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--hover)}
.cwbox .cwt{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.cwbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;flex:none}
.cwbox+.cwbody{margin-top:8px}
.media{position:relative;display:grid;gap:2px;margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.media.n1{grid-template-columns:1fr}
.media.n2,.media.n3,.media.n4{grid-template-columns:1fr 1fr}
.mcell{position:relative;background:var(--line);min-height:0;overflow:hidden}
.media.n1 .mcell img,.media.n1 .mcell video{width:100%;max-height:440px;object-fit:cover;display:block}
.media:not(.n1) .mcell{aspect-ratio:1}
.media.n3 .mcell:first-child{aspect-ratio:auto;grid-row:span 2}
.media:not(.n1) .mcell img,.media:not(.n1) .mcell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mcell audio{width:100%;display:block;padding:8px}
.mcell a{display:block;padding:12px;color:var(--accent)}
.media.blur .mcell{filter:blur(28px)}
.mcover{position:absolute;inset:0;border:0;background:rgba(0,0,0,.25);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.mcover b{font-size:15px}
.poll{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.po{position:relative;border-radius:8px;overflow:hidden;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;background:var(--hover)}
.po i{position:absolute;top:0;bottom:0;left:0;background:var(--accent-soft)}
.po span{position:relative}
.pmeta{font-size:13px;color:var(--sub)}
.actions{display:flex;justify-content:space-between;max-width:420px;margin:8px 0 -6px -8px}
.act{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--sub);padding:7px 8px;border-radius:999px;font-size:13px;line-height:1;min-width:44px}
.act .ic{width:19px;height:19px}
.act.on.boost{color:var(--boost)}
.act.on.fav{color:var(--fav)}
.act.on.bm{color:var(--accent)}
.act.on.fav .ic,.act.on.bm .ic{fill:currentColor}
.act:disabled{opacity:.35;cursor:default}
.status.focus{cursor:default}
.status.focus .content{font-size:calc(var(--post-fs) + 2px);margin-top:10px}
/* 글 상세: 트위터처럼 위에 프로필(사진 + 이름/아이디 두 줄), 아래 본문은 화면 폭 전체 */
.status.focus .row{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:0;align-items:center}
.status.focus .left{grid-column:1;grid-row:1}
.status.focus .body{display:contents}
.status.focus .body>*{grid-column:1/-1}
.status.focus .body>.meta{grid-column:2;grid-row:1;flex-wrap:wrap;row-gap:0;white-space:normal}
.status.focus .meta .name{order:1;font-size:16px}
.status.focus .meta .vis{order:2}
.status.focus .meta .handle{order:3;flex-basis:100%}
.status.focus .meta .dot,.status.focus .meta .time{display:none}
.status.focus{padding-bottom:0}
.status.focus .meta .handle{font-size:14.5px;line-height:1.35}
.status.focus .replyto{justify-self:start;margin:12px 0 0}
.status.focus .cwbox{margin-top:12px}
.status.focus .cwbody{margin-top:12px}
.status.focus .cwbox:not([hidden])+.cwbody{margin-top:8px}
.status.focus .content{margin-top:0;line-height:1.55}
.status.focus .fulltime{margin-top:14px;padding-bottom:12px}
.status.focus .fstats{padding:12px 0}
.status.focus .actions{max-width:none;margin:0 -8px;padding:4px 0;justify-content:space-around}
.status.focus .act{padding:10px;min-width:0}
.status.focus .act .ic{width:22px;height:22px}
.status.focus .act span{display:none}
.fulltime{margin-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--sub);font-size:14px}
.tail{min-height:55vh}
.thsec{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--sub);background:var(--hover);border-bottom:1px solid var(--line)}
.thsec .ic{width:16px;height:16px}

/* 피드 상태 */
.sentinel{min-height:80px;display:flex;align-items:center;justify-content:center;padding:16px}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty,.end{color:var(--sub);text-align:center;font-size:14px;padding:24px}
.err{text-align:center;color:var(--sub);font-size:14px}
.err p{margin:0 0 10px}

/* 알림 */
.notif{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.notif:active{background:var(--hover)}
.nic{width:44px;display:flex;justify-content:flex-end;flex:none;padding-top:2px;color:var(--accent)}
.nic .ic{width:26px;height:26px}
.nic.fav{color:var(--fav)}
.nic.fav .ic{fill:currentColor}
.nic.boost{color:var(--boost)}
.notif .av{width:32px;height:32px}
.ntext{margin-top:6px}
.nsnip{color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.nbtns{display:flex;gap:8px;margin-top:10px;color:var(--sub);font-size:14px}

/* 프로필 */
.pbanner{height:150px;background:var(--accent-soft) center/cover no-repeat}
.phead{padding:0 16px 14px;border-bottom:1px solid var(--line)}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;margin-top:-42px}
.ptop .pbtn{margin-top:54px}
.pav{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:var(--line);cursor:pointer}
.pname{font-size:20px;font-weight:800;margin-top:8px;overflow-wrap:anywhere}
.pacct{color:var(--sub);display:flex;align-items:center;gap:4px;overflow-wrap:anywhere}
.pacct .ic{width:14px;height:14px}
.pnote{margin-top:10px}
.pfields{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pf{display:flex;border-top:1px solid var(--line);font-size:14px}
.pf:first-child{border-top:0}
.pf dt{width:34%;flex:none;padding:8px 10px;color:var(--sub);background:var(--hover);margin:0;overflow-wrap:anywhere}
.pf dd{margin:0;padding:8px 10px;flex:1;min-width:0}
.pstats{display:flex;gap:16px;margin-top:12px;font-size:14px;color:var(--sub);flex-wrap:wrap}
.pstats b{color:var(--fg)}

/* 시트 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;overscroll-behavior:contain;animation:su .2s ease-out}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px;padding-bottom:12px}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet h3{margin:4px 20px 8px;font-size:17px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 20px}
.opt:active{background:var(--hover)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .t small{display:block;color:var(--sub);font-size:13px}
.opt .av{width:40px;height:40px}
.chk{color:var(--accent);display:flex}
.oi{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(30px);opacity:.5}}

/* 글쓰기 */
.cov{position:fixed;top:0;left:0;right:0;height:100%;z-index:40;background:rgba(0,0,0,.4);display:flex;justify-content:center;align-items:flex-start;animation:fi .15s}
.compose{width:100%;max-width:600px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
@media(min-width:640px){.cov{padding-top:5vh}.compose{height:auto;max-height:90%;border-radius:20px;overflow:hidden}}
.c-top{display:flex;align-items:center;padding:8px 12px;gap:8px}
.c-draft{font-size:12px;color:var(--sub)}
.c-scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.c-replyto{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--hover);font-size:14px}
.crh{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crb{color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin-top:2px;overflow-wrap:anywhere}
.c-replyto.tap{cursor:pointer}
.c-replyto .crh{display:flex;align-items:center;gap:6px;min-width:0}
.crav{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);cursor:pointer}
.crname{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.crname small{font-weight:500;color:var(--sub);font-size:13px}
.crto{font-weight:500;color:var(--sub);flex:none;font-size:13px}
.crchev{margin-left:auto;display:flex;color:var(--sub);flex:none;transition:transform .15s}
.crchev .ic{width:16px;height:16px}
.c-replyto.open .crchev{transform:rotate(180deg)}
.crfull{margin-top:6px;max-height:50vh;overflow-y:auto;overscroll-behavior:contain}
.crfull .content{font-size:15px;color:var(--fg)}
.crfull .media{margin-top:8px}
.crcw{font-weight:700;margin-bottom:6px}
.crx{color:var(--sub);font-size:12.5px;margin-top:6px}
.c-row{display:flex;gap:12px}
.c-acc{border:0;background:none;padding:0;flex:none;align-self:flex-start}
.c-main{flex:1;min-width:0}
.c-accname{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:inline-block}
.c-cw{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--hover);outline:none;font-size:16px}
.c-text{width:100%;border:0;outline:none;resize:none;background:none;font-size:max(17px, var(--post-fs));line-height:1.5;min-height:140px;margin-top:8px;padding:0;display:block}
/* @아이디·#태그 파란색: 입력칸 글자는 투명하게, 바로 뒤에 같은 글자를 색 입혀 그림 */
.c-tw{position:relative;margin-top:8px}
.c-tw .c-text{margin-top:0;position:relative;color:transparent;caret-color:var(--fg);-webkit-text-fill-color:transparent}
.c-tw .c-text::placeholder{color:var(--sub);-webkit-text-fill-color:var(--sub);opacity:1}
.c-tw .c-text::selection{color:transparent;-webkit-text-fill-color:transparent;background:rgba(99,100,255,.25)}
.c-hl,.c-tw .c-text{font:inherit;font-size:max(17px, var(--post-fs));line-height:1.5;letter-spacing:normal;white-space:pre-wrap;overflow-wrap:break-word;word-break:keep-all;tab-size:4}
.c-hl{position:absolute;top:0;left:0;right:0;pointer-events:none;color:var(--fg);padding:0;margin:0}
.c-hl .hm{color:var(--accent)}
/* 글자수를 넘긴 부분: 빨간 배경 */
.c-hl .over{background:rgba(244,33,46,.18);color:var(--danger);border-radius:2px}
.c-hl .over .hm{color:var(--danger)}
.c-media{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.c-media:empty{display:none}
.cm{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line)}
.cm img,.cm video{width:100%;height:100%;object-fit:cover;display:block}
.cm.up::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.cm .spin{position:absolute;top:50%;left:50%;margin:-12px 0 0 -12px;z-index:1}
.cm .x{position:absolute;top:6px;right:6px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.cm .x .ic{width:16px;height:16px}
.c-bar{display:flex;align-items:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.c-bar .ibtn{color:var(--accent)}
.tbtn{font-weight:800;font-size:13px;width:auto;padding:0 10px;border-radius:999px}
.tbtn.on{background:var(--accent-soft)}
.vbtn{display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--accent);width:38px;height:38px;padding:0;border-radius:50%;flex:none}
.vbtn .ic{width:20px;height:20px}
.c-count{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-count.over{color:var(--danger);font-weight:700}

/* 로그인 */
.login{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 24px 40px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.logo .ic{width:34px;height:34px}
.login h2{font-size:28px;margin:20px 0 6px;letter-spacing:-.03em}
.lead{color:var(--sub);margin:0 0 28px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.help{font-size:13px;color:var(--sub);margin:8px 0 0}
.big{width:100%;padding:14px;font-size:16px;margin-top:20px}
.codebox{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:14px}
.codebox .big{margin-top:12px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:14px;padding:14px 0 0;font-weight:600;text-align:left}
.safe{display:flex;gap:8px;margin-top:24px;padding:12px;border-radius:12px;background:var(--hover);font-size:13px;color:var(--sub)}
.safe .ic{width:16px;height:16px;margin-top:2px}

/* 내 계정 */
.sec{border-bottom:8px solid var(--hover)}
.sec h3{font-size:16px;margin:0;padding:16px 16px 8px}
.secdesc{margin:0;padding:0 16px 4px;color:var(--sub);font-size:13px}
.secpad{padding:6px 16px 16px}
.accrow{display:flex;align-items:center;gap:12px;padding:10px 16px}
.accrow .t{flex:1;min-width:0}
.accrow .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .t small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .btns{display:flex;gap:6px;align-items:center;flex:none}
details.gl{border-top:1px solid var(--line)}
details.gl summary{padding:14px 16px;font-weight:600;cursor:pointer}
details.gl p{margin:0;padding:0 16px 14px;color:var(--sub);font-size:14px}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:24px 16px;margin:0}

/* 토스트·라이트박스 */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);width:max-content;text-align:center;animation:fi .2s}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .ibtn{position:absolute;color:#fff;background:rgba(255,255,255,.14)}
.lb .x{top:calc(12px + env(safe-area-inset-top));left:12px}
.lb .prev{left:8px;top:50%;transform:translateY(-50%)}
.lb .next{right:8px;top:50%;transform:translateY(-50%)}
.lb .altbtn{position:absolute;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;padding:6px 9px}
.lb .altbtn.on{background:#fff;color:#000}
.lb .altbox{position:absolute;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));max-height:40vh;overflow-y:auto;overscroll-behavior:contain;background:rgba(0,0,0,.82);color:#fff;font-size:14.5px;line-height:1.55;padding:12px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}

/* 인용글 */
.has-quote .content .quote-inline{display:none}
.quote{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;overflow:hidden;background:var(--bg);color:var(--fg)}
.quote:active{background:var(--hover)}
.qmeta{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;font-size:14px}
.qav{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.qcontent{margin-top:4px;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.qcontent .quote-inline{display:none}
.quote .media{margin-top:8px;border-radius:12px}
.quote .media.n1 .mcell img,.quote .media.n1 .mcell video{max-height:220px}
.qcw{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.qcw span{flex:1;min-width:0}
.qnest{margin-top:6px;color:var(--sub);font-size:13.5px}
.quote.qmsg{cursor:default;display:flex;align-items:center;gap:8px;background:var(--hover);color:var(--sub);font-size:13.5px}
.quote.qmsg span{flex:1}

/* 옆으로 밀기 */
#main{touch-action:pan-y;overflow-x:clip}
.swipe-nb{position:fixed;bottom:0;z-index:4;overflow:hidden;background:var(--bg);pointer-events:none;will-change:transform}

/* 새로고침 */
.ptr{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,0);opacity:0;z-index:30;width:36px;height:36px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--accent);pointer-events:none}
.topspin{display:flex;justify-content:center;padding:12px 0;border-bottom:1px solid var(--line)}

/* 팝업 알림 */
.pop{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;width:calc(100% - 20px);max-width:460px;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;animation:pd .25s ease-out}
.pop .av{width:40px;height:40px}
.pop .pic{position:absolute;left:38px;top:34px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--accent);border:2px solid var(--bg)}
.pop .pic .ic{width:11px;height:11px;stroke-width:2.6}
.pop .pic.fav{background:var(--fav)}
.pop .pic.fav .ic{fill:currentColor}
.pop .pic.boost{background:var(--boost)}
.pop .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.pop .pt b{font-weight:700}
.pop .t small{display:block;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .ibtn{width:32px;height:32px;color:var(--sub)}
.pop .ibtn .ic{width:16px;height:16px}
@keyframes pd{from{transform:translate(-50%,-20px);opacity:0}}
@keyframes pu{to{transform:translate(-50%,-24px);opacity:0}}
.pop.out{animation:pu .25s ease-in forwards;pointer-events:none}

/* 쪽지 목록 */
.dmrow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.dmrow:active{background:var(--hover)}
.dmav{position:relative;width:48px;height:48px;flex:none}
.dmav img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.dmav.grp img{width:34px;height:34px;position:absolute;border:2px solid var(--bg)}
.dmav.grp img:first-child{top:0;left:0}
.dmav.grp img:nth-child(2){bottom:0;right:0}
.dmrow .t{flex:1;min-width:0}
.dmtop{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.dmlast{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.dmrow.unread .dmlast{color:var(--fg);font-weight:600}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;visibility:hidden}
.dmrow.unread .udot{visibility:visible}

/* 쪽지 대화 */
body.in-chat .bnav,body.in-chat .fab{display:none}
body.in-chat{overflow:hidden}
body.in-chat #shell{padding-bottom:0;min-height:0}
.chat{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top));bottom:0;z-index:5;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:640px){.chat{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 12px 14px}
.chead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px 22px;border-bottom:1px solid var(--line);margin:0 -12px 8px;cursor:pointer}
.chead .avs{display:flex}
.chead .avs img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);border:3px solid var(--bg);margin-left:-14px}
.chead .avs img:first-child{margin-left:0}
.chead b{font-size:17px;margin-top:8px}
.chead small{color:var(--sub)}
.chead .note{font-size:13px;color:var(--sub);margin-top:10px;max-width:320px}
.dday{text-align:center;color:var(--sub);font-size:12px;margin:16px 0 6px}
.msg{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.msg.gap{margin-top:12px}
.msg.mine{justify-content:flex-end}
.mav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);cursor:pointer}
.mav.hide{visibility:hidden}
.mcol{display:flex;flex-direction:column;max-width:78%;min-width:0}
.msg.mine .mcol{align-items:flex-end}
.mname{font-size:12px;color:var(--sub);margin:0 0 2px 12px}
.bub{position:relative;padding:9px 14px;border-radius:20px;background:var(--hover);border:1px solid var(--line);overflow-wrap:anywhere;word-break:break-word;cursor:pointer;max-width:100%}
.msg.mine .bub{background:var(--accent);color:#fff;border-color:transparent}
.msg.theirs.rend .bub{border-bottom-left-radius:6px}
.msg.mine.rend .bub{border-bottom-right-radius:6px}
.bub .content{margin:0}
.msg.mine .bub .content a{color:#fff;text-decoration:underline}
.bub .media{margin:6px -6px -2px;border-radius:14px}
.bcw{display:flex;align-items:center;gap:8px;font-weight:600}
.bcw span{flex:1;min-width:0}
.bcw+.bbody{margin-top:6px}
.msg.mine .cwbtn{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.bfav{position:absolute;bottom:-8px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--fav);display:flex;align-items:center;justify-content:center}
.msg.mine .bfav{right:auto;left:-4px}
.bfav .ic{width:12px;height:12px;fill:currentColor}
.mtime{font-size:11.5px;color:var(--sub);margin:3px 6px 0}
.cbar{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.cbar .in{max-width:580px;margin:0 auto;display:flex;align-items:flex-end;gap:4px}
.cbar .ibtn{color:var(--accent)}
.cbox{flex:1;min-width:0;background:var(--hover);border-radius:20px;padding:2px 14px;display:flex;flex-direction:column}
.cbox textarea{border:0;background:none;outline:none;resize:none;font-size:16px;line-height:1.4;max-height:140px;padding:8px 0;width:100%;display:block}
.cthumbs{display:flex;gap:6px;padding:8px 0 2px;flex-wrap:wrap}
.cthumbs:empty{display:none}
.cthumbs .cm{width:64px;height:64px}
.cbar .csend{background:var(--accent);color:#fff}
.cbar .csend:disabled{opacity:.4;cursor:default}
.ccount{font-size:12px;color:var(--danger);font-weight:700;align-self:center}

/* 설정 화면 */
#tTabs{overflow-x:auto;scrollbar-width:none}
#tTabs::-webkit-scrollbar{display:none}
#tTabs button{flex:1 0 auto;padding-left:14px;padding-right:14px;white-space:nowrap}
#tEdit{color:var(--sub)}
.srow{display:flex;align-items:center;gap:10px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.srow:active{background:var(--hover)}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-weight:600}
.srow .t small{display:block;color:var(--sub);font-size:13px}
.srow .chev{color:var(--sub);display:flex}
.srow .chev .ic{width:18px;height:18px}
.qhelp{position:relative;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;background:none;color:var(--sub);opacity:.55;font-size:10px;font-weight:600;line-height:1;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:1px;margin-left:5px}
.qhelp::after{content:"";position:absolute;inset:-10px}
.sec .tg .t b,.chooser .ct b{display:inline}
.tg .t small,.chooser .ct small{margin-top:2px}
.chooser{padding:12px 16px}
.chooser .ct small{display:block;color:var(--sub);font-size:13px}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:72px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--fg)}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.helpsheet p{margin:0;padding:4px 20px 16px;color:var(--fg);font-size:15px;line-height:1.6}
.tabrow{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line)}
.tabrow .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabrow .t small{display:block;font-weight:400;color:var(--sub);font-size:12.5px}
.tabrow .ibtn{width:34px;height:34px;color:var(--sub)}
.tabrow .ibtn:disabled{opacity:.3}
.tabrow .ibtn .ic{width:18px;height:18px}
.addrow{display:flex;gap:8px;padding:8px 16px 16px}
.addrow input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none}
.addrow input:focus{border-color:var(--accent)}
.psec{font-size:13px;font-weight:700;color:var(--sub);padding:10px 20px 4px}
.mutual{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.fwarn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--sub);font-size:14px}
.fwarn span{flex:1;min-width:0}

/* 알림 종류별 색 */
:root{--k-reply:#1d9bf0;--k-status:#f59e0b;--k-quote:#8b5cf6;--k-dm:var(--accent);--k-mention:var(--accent)}
.pop .pic.k-reply{background:var(--k-reply)}
.pop .pic.k-status{background:var(--k-status)}
.pop .pic.k-quote{background:var(--k-quote)}
.pop .pic.k-dm{background:var(--k-dm)}
.ptag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;color:#fff;vertical-align:1px;background:var(--accent)}
.ptag.k-reply{background:var(--k-reply)}
.ptag.k-status{background:var(--k-status)}
.ptag.k-quote{background:var(--k-quote)}
.ptag.k-fav{background:var(--fav)}
.ptag.k-boost{background:var(--boost)}

/* 계정 메모 */
:root{--memo-bg:#fff8e1;--memo-line:#f3dfa0;--memo-ink:#a16207}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--memo-bg:#2a2414;--memo-line:#4d4120;--memo-ink:#e5b84a}}
:root[data-theme=dark]{--memo-bg:#2a2414;--memo-line:#4d4120;--memo-ink:#e5b84a}
.memo{margin-top:12px;padding:10px 12px;border:1px solid var(--memo-line);border-radius:12px;background:var(--memo-bg)}
.memo .mhead{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--memo-ink);min-width:0}
.memo .mhead .ic{width:15px;height:15px}
.memo .mhead .mwho{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.memo .mhead .mini{background:var(--bg)}
.memo .mtext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;font-size:14.5px;line-height:1.55}
.memo .mempty{margin-top:6px;font-size:13.5px;color:var(--sub)}
.memo textarea{width:100%;margin-top:8px;min-height:110px;padding:10px 12px;border:1px solid var(--memo-line);border-radius:10px;background:var(--bg);font-size:15px;line-height:1.5;resize:vertical;outline:none;display:block}
.memo .mbtns{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.memo .mbtns small{flex:1;color:var(--sub);font-size:12px}
.c-memos{margin:0 0 12px}
.c-memos .memo:first-child{margin-top:0}
.c-memos .memo{margin-top:8px}
.c-memobtn{position:relative}
.c-memobtn.on{background:var(--accent-soft)}
.c-memobtn.has::after{content:"";position:absolute;top:6px;right:4px;width:7px;height:7px;border-radius:50%;background:#f59e0b}

/* 프로필 툿·답글 탭, 고정 툿 */
.ptabs .ptsearch{flex:0 0 52px;display:flex;align-items:center;justify-content:center}
.ptabs .ptsearch .ic{width:19px;height:19px}
.ptabs .ptsearch.on::after{width:28px}
.ptabs{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:10;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pre.k-pin{color:var(--sub)}

/* 팔로잉·팔로워 목록 */
.pst{border:0;background:none;padding:0;color:var(--sub);font-size:14px;cursor:pointer}
.pst b{color:var(--fg)}
.pst:active{opacity:.6}
.frow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:active{background:var(--hover)}
.frow .t{flex:1;min-width:0}
.frow .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .t small{display:block;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fnote{font-size:13.5px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frow .fyou{font-size:11px;font-weight:700;color:var(--sub);background:var(--hover);border-radius:4px;padding:1px 5px;margin-left:4px}
.shotpick{border-top:1px solid var(--line);margin-top:8px}
.shotrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.shotrow:last-child{border-bottom:0}
.shotrow input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.shotrow .av{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover}
.shotrow .t{flex:1;min-width:0}
.shotrow .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shotrow .t small{display:block;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shotrow.me{background:var(--accent-soft)}
.shotpv{padding:4px 16px 0;transition:opacity .2s}
.shotpv.busy{opacity:.5}
.shotpv img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.shotbar{display:flex;gap:8px;padding:4px 16px 16px}
.shotbar .pill{flex:1;padding:11px 18px}
.bklog{margin:0 16px 16px;height:180px;overflow:auto;background:#1e1e1e;color:#d4d4d4;font:12.5px/1.5 ui-monospace,Consolas,monospace;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-all}
.bklog>span{color:#8b98a5}
.bkframe{display:block;width:calc(100% - 32px);height:60vh;margin:0 16px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}

/* 내 계정(내 프로필) 바로가기 */
.mechips{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mechips::-webkit-scrollbar{display:none}
.mechips .pill{flex:none;padding:7px 14px;font-size:14px}
.mechips .pill .ic{width:16px;height:16px}

/* 프로필 편집·설정 */
.pbtn{display:flex;gap:8px;align-items:center}
.pbtn .ibtn{border:1px solid var(--line)}
.pbtn .ibtn .ic{width:18px;height:18px}
.pbtn .ibtn.on{color:var(--accent);border-color:var(--accent)}
.pbtn .ibtn.on .ic{fill:currentColor}
.ebanner{position:relative}
.ephoto{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.eav{position:relative;width:84px;height:84px}
.eav .pav{display:block}
.eform{padding:6px 0 28px}
.eform .field{margin-top:16px}
.eform label small{font-weight:400;color:var(--sub);margin-left:4px}
.eform textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:none;resize:vertical;min-height:110px;display:block}
.eform textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.erow{display:flex;gap:8px;margin-top:8px}
.eform .erow input{padding:11px 12px;font-size:15px}
.erow input:first-child{width:36%;flex:none}
.tg{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.tg .t{flex:1;min-width:0}
.tg .t b{display:block;font-weight:600}
.tg .t small{display:block;color:var(--sub);font-size:13px}
.tg input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{transform:translateX(18px)}
.eform .tg{padding:4px 0;margin-top:16px}
.eform .tg .t b{font-size:14px;font-weight:700}
.eform .tg .t small{margin-left:0;margin-top:3px}
.mehead{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.mehead .av{width:56px;height:56px}
.mehead .t{min-width:0}
.mehead .t b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehead .t small{color:var(--sub)}
.twobtn{display:flex;gap:8px}
.twobtn .pill{flex:1}
.pushst{font-size:14px;color:var(--sub);margin:0 0 10px}
.pushst b{color:var(--fg)}

/* 수정됨·수정 기록·좋아요한 사람 */
.edt{color:var(--sub);flex:none}
.edbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600}
.fstats{display:flex;gap:18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.fstats button{border:0;background:none;padding:0;color:var(--sub)}
.fstats b{color:var(--fg)}
body.no-counts .fstats b{display:none}
.hv{padding:12px 20px;border-top:1px solid var(--line)}
.hvt{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--sub);margin-bottom:4px}
.hvt b{color:var(--fg);font-size:14px}
.hvcw{font-weight:600;margin-bottom:4px}
.hvx{color:var(--sub);font-size:13px;margin-top:4px}

/* 투표하기 */
.pvo{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;text-align:left}
.pvo .pbox{width:18px;height:18px;border:2px solid var(--sub);border-radius:50%;flex:none}
.pvo.multi .pbox{border-radius:5px}
.pvo.on{border-color:var(--accent);background:var(--accent-soft)}
.pvo.on .pbox{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--bg)}
.pvo .pt{flex:1;min-width:0;overflow-wrap:anywhere}
.pvbar{display:flex;align-items:center;gap:12px;margin-top:2px}
.pvbar .pill{padding:7px 18px;font-size:14px}
.poll .linkbtn{padding:0;font-size:13px}
.po.top{font-weight:700}
.pmine{display:inline-flex;color:var(--accent);vertical-align:-3px}
.pmine .ic{width:15px;height:15px;stroke-width:2.6}

/* 글쓰기: 사진 설명·민감 표시·투표·인용·자동완성·이모지 */
.calt{position:absolute;left:6px;bottom:6px;z-index:2;border:0;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 7px}
.calt.on{background:#fff;color:#000}
.c-sens{display:flex;align-items:center;gap:6px;margin-top:8px;border:0;background:none;color:var(--sub);font-size:13px;font-weight:600;padding:4px 0}
.c-sens .ic{width:16px;height:16px}
.c-sens.on{color:var(--danger)}
.altsheet .altpv{display:block;max-width:calc(100% - 40px);max-height:28vh;margin:0 20px 10px;border-radius:12px;object-fit:contain;background:var(--line)}
.altsheet textarea,.repsheet textarea{display:block;width:calc(100% - 40px);margin:0 20px;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;line-height:1.5;resize:vertical;outline:none}
.altsheet textarea:focus,.repsheet textarea:focus{border-color:var(--accent)}
.altrow{display:flex;align-items:center;gap:8px;padding:10px 20px 4px}
.altrow small{flex:1;color:var(--sub);font-size:12px}
.c-poll{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:8px}
.cpo{display:flex;align-items:center;gap:4px}
.cpo input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;outline:none}
.cpo input:focus{border-color:var(--accent)}
.cpo .ibtn{width:32px;height:32px;color:var(--sub)}
.cpo .ibtn:disabled{opacity:.3}
.cpo .ibtn .ic{width:16px;height:16px}
.cpadd{display:flex;align-items:center;gap:6px;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 12px;color:var(--accent);font-weight:700;font-size:14px}
.cpadd .ic{width:16px;height:16px}
.cpopts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.cpopts select{padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.cpopts label{display:flex;align-items:center;gap:4px;flex:1;min-width:140px}
.c-pollbtn.on{background:var(--accent-soft)}
.c-note{margin:6px 0 0;font-size:12.5px;color:var(--sub)}
.c-quote .quote.cq{pointer-events:none}
.c-sugg{max-height:40vh;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);background:var(--bg)}
.c-sugg .sg{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 16px}
.c-sugg .sg:active{background:var(--hover)}
.c-sugg .sg .av{width:34px;height:34px}
.c-sugg .sg .em{width:30px;height:30px;object-fit:contain}
.c-sugg .sg .oi{width:34px;height:34px}
.c-sugg .sg .oi .ic{width:16px;height:16px}
.c-sugg .sg .t{flex:1;min-width:0}
.c-sugg .sg b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.c-sugg .sg small{display:block;color:var(--sub);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px;padding:0 12px 8px}
.emogrid button{border:0;background:none;border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;padding:4px}
.emogrid button:active{background:var(--hover)}
.emogrid img{max-width:32px;max-height:32px;object-fit:contain}
.emocat{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--sub);padding:10px 4px 2px}
.emosheet{max-height:70vh}

/* 신고 */
.rrules{padding:0 20px 8px}
.rrule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.rrule input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--accent)}
.repsheet .tg{padding:12px 20px}

/* 해시태그 화면 */
.taghead{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.taghead .t{flex:1;min-width:0}
.taghead .t b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taghead .t small{display:block;color:var(--sub);font-size:13px}
.taghead .btns{display:flex;gap:8px;align-items:center;width:100%;padding-left:56px}

.reqchip{flex:none}

/* 프로필 안 툿 검색 */
.psbar{display:flex;align-items:center;gap:6px;margin:10px 12px 6px;padding:0 4px 0 14px;border-radius:999px;background:var(--hover);border:1px solid transparent}
.psbar:focus-within{border-color:var(--accent);background:var(--bg)}
.psbar .sic{display:flex;color:var(--sub)}
.psbar .sic .ic{width:17px;height:17px}
.psbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:10px 0;-webkit-appearance:none;appearance:none}
.psbar input::-webkit-search-cancel-button{display:none}
.psbar .ibtn{width:32px;height:32px;color:var(--sub)}
.psbar .ibtn .ic{width:16px;height:16px}
.psinfo{padding:2px 16px 10px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.content mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme=dark] .content mark{background:#6b5a12}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .content mark{background:#6b5a12}}

/* 부드러운 움직임 */
@keyframes fo{to{opacity:0}}
@keyframes sd{to{transform:translateY(48px)}}
@keyframes cu{from{transform:translateY(28px);opacity:.4}}
@keyframes cd{to{transform:translateY(36px)}}
@keyframes popk{0%{transform:scale(1)}35%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.ov.out{animation:fo .2s ease-in forwards;pointer-events:none}
.ov.out .sheet{animation:sd .2s ease-in forwards}
.sheet{animation-timing-function:cubic-bezier(.2,.8,.3,1)}
.compose{animation:cu .26s cubic-bezier(.2,.8,.3,1)}
.cov.out{animation:fo .22s ease-in forwards;pointer-events:none}
.cov.out .compose{animation:cd .22s ease-in forwards}
.lb{animation:fi .18s ease-out}
.lb.out{animation:fo .18s ease-in forwards;pointer-events:none}
.toast{transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translate(-50%,8px)}
.ptr.spinning .ic{animation:sp .8s linear infinite}
.act .ic{transition:transform .12s}
.act:active .ic{transform:scale(.82)}
.act.tapfx .ic{animation:popk .42s cubic-bezier(.2,.8,.3,1)}
.pill,.fab,.mini,.mqsort{transition:transform .12s,opacity .12s}
.pill:active:not(:disabled),.mini:active:not(:disabled),.mqsort:active{transform:scale(.96)}
.fab:active{transform:scale(.92)}
.bnav button .ic{transition:transform .15s}
.bnav button:active .ic{transform:scale(.88)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 멘션 답장 관리 */
.mqbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.mqseg{display:flex;background:var(--hover);border-radius:999px;padding:3px;flex:1;min-width:0}
.mqseg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 8px;font-size:13.5px;font-weight:600;color:var(--sub);white-space:nowrap}
.mqseg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mqsort{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;flex:none}
.mqsort .ic{width:15px;height:15px}
.mqsum{padding:0 16px;border-bottom:1px solid var(--line);background:var(--hover);font-size:13px;color:var(--sub)}
.mqsum:empty{display:none}
.mqt{padding:9px 0 2px}
.mqt b{color:var(--fg)}
.mqsum .linkbtn{padding:2px 0 9px;font-size:13px}
.mqsum .mqt:only-child{padding-bottom:9px}
.rq{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.rqs{display:inline-flex;align-items:center;gap:4px;flex:1;font-size:13px;font-weight:700}
.rqs .ic{width:15px;height:15px;stroke-width:2.2}
.mq-todo .rqs{color:#e8590c}
.mq-replied .rqs{color:var(--boost)}
.mq-done .rqs{color:var(--sub)}
.status.mq-replied,.status.mq-done{opacity:.62}
.status.flash{animation:fl 1.2s}
.mqload{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 16px;color:var(--accent);font-size:14px;font-weight:700}
.mqload .ic{width:16px;height:16px;stroke-width:2.2}
.mqload:active{background:var(--hover)}
.mqmore:not(.top) .mqload{border-bottom:0}
.mqend{padding:11px 16px;text-align:center;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}
.mqmore:not(.top) .mqend{border-bottom:0}
@keyframes fl{0%,40%{background:var(--accent-soft)}}
</style>
</head>

<div id="shell">
  <header class="top" id="top">
    <div class="top-row">
      <button class="ibtn" id="tLeft" type="button"></button>
      <h1 id="tTitle"></h1>
      <button class="ibtn" id="tEdit" type="button" aria-label="홈 탭 편집" hidden></button>

</div>

</div></nav>

/* HTML 정리: 허용한 태그만 남기고 링크는 새 창으로 */
const ALLOWED = new Set(['P','BR','A','SPAN','B','STRONG','I','EM','U','DEL','S','CODE','PRE','BLOCKQUOTE','UL','OL','LI']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT','TEXTAREA','SELECT','BUTTON','svg','SVG','MATH','TEMPLATE','NOSCRIPT']);
function clean(node){
  for (const ch of [...node.childNodes]){
    if (ch.nodeType === 1){
      if (DROP.has(ch.tagName)){ ch.remove(); continue; }
      clean(ch);
      if (!ALLOWED.has(ch.tagName)){ ch.replaceWith(...ch.childNodes); continue; }
      const href = ch.getAttribute('href'), cls = ch.getAttribute('class');
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      if (ch.tagName === 'A'){
        if (href && /^https?:\/\//i.test(href)) ch.setAttribute('href', href);
        ch.setAttribute('target', '_blank'); ch.setAttribute('rel', 'noopener noreferrer');
      }
      if (cls){
        const keep = cls.split(/\s+/).filter(c => ['invisible','ellipsis','mention','hashtag','quote-inline'].includes(c));
        if (keep.length) ch.setAttribute('class', keep.join(' '));
      }
    } else if (ch.nodeType !== 3) ch.remove();
  }
}
function cleanHTML(html){
  const d = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  const root = d.body.firstElementChild; clean(root);
  const frag = document.createDocumentFragment(); frag.append(...root.childNodes); return frag;
}
/* 커스텀 이모지 :shortcode: → 이미지 (텍스트 노드만 바꿈) */
function emojifyNode(root, emojis){
  if (!emojis || !emojis.length) return;
  const map = Object.fromEntries(emojis.map(e => [e.shortcode, SET.anim ? (e.url || e.static_url) : (e.static_url || e.url)]));
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const t of nodes){
    const s = t.nodeValue; if (!s.includes(':')) continue;
    const re = /:([a-zA-Z0-9_]+):/g; let m, last = 0, hit = false;
    const frag = document.createDocumentFragment();
    while ((m = re.exec(s))){
      const u = map[m[1]]; if (!u) continue;
      hit = true; frag.append(s.slice(last, m.index));
      const img = document.createElement('img'); img.className = 'emoji'; img.src = u; img.alt = m[0]; img.title = m[0]; img.loading = 'lazy';
      frag.append(img); last = m.index + m[0].length;
    }
    if (hit){ frag.append(s.slice(last)); t.replaceWith(frag); }
  }
}
function richName(a){
  const s = document.createElement('span');
  s.textContent = a.display_name || a.username; emojifyNode(s, a.emojis); return s;
}

function qs(obj){ const u = new URLSearchParams(); for (const [k, v] of Object.entries(obj)) (Array.isArray(v) ? v : [v]).forEach(x => u.append(k, x)); return u.toString(); }
async function api(path, {method='GET', body=null, form=null, acc=cur(), headers={}, withLink=false, signal} = {}){
  const opt = {method, headers:{Authorization:'Bearer ' + acc.token, ...headers}, signal};
  if (form) opt.body = form;
  else if (body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try{ r = await fetch(`https://${acc.instance}${path}`, opt); }
  catch(e){ throw new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  if (!r.ok){
    let msg = ''; try{ msg = (await r.json()).error; }catch(e){}
    const err = new Error(r.status === 401 ? '로그인이 만료되었어요. 내 계정에서 이 계정을 다시 추가해 주세요.' : msg || `요청이 실패했어요 (${r.status})`);
    err.status = r.status; throw err;
  }
  const txt = await r.text(); const data = txt ? JSON.parse(txt) : null;
  if (!withLink) return data;
  let next = null;
  const m = /<([^>]+)>\s*;\s*rel="next"/.exec(r.headers.get('Link') || '');
  if (m){ try{ const u = new URL(m[1]); next = u.pathname + u.search; }catch(e){} }
  return {data, next};
}

const canRedirect = () => location.protocol === 'https:' || location.hostname === 'localhost';
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
function normInstance(v){
  v = v.trim().toLowerCase();
  if (v.includes('@') && !v.includes('/')) v = v.split('@').pop();
  return v.replace(/^https?:\/\//, '').replace(/[/?#].*$/, '');
}
async function postForm(url, data){
  let r;
  try{ r = await fetch(url, {method:'POST', body:new URLSearchParams(data)}); }
  catch(e){ throw new Error('서버에 연결하지 못했어요. 주소를 다시 확인해 주세요.'); }
  if (!r.ok){ let msg = ''; try{ const j = await r.json(); msg = j.error_description || j.error; }catch(e){} throw new Error(msg || `서버가 요청을 거절했어요 (${r.status})`); }
  return r.json();
}
async function getApp(instance){
  const key = 'ytt.app.' + instance, ru = redirectUri();
  let app = LS.get(key, null);
  if (app && app.redirect === ru && app.scopes === SCOPES) return app;
  const data = {client_name:APP_NAME, redirect_uris: canRedirect() ? ru + '\n' + OOB : OOB, scopes:SCOPES};
  if (canRedirect()) data.website = ru;
  const j = await postForm(`https://${instance}/api/v1/apps`, data);
  app = {client_id:j.client_id, client_secret:j.client_secret, redirect:ru, scopes:SCOPES, vapid_key:j.vapid_key || null};
  LS.set(key, app); return app;
}
async function authUrl(instance, mode, force){
  const app = await getApp(instance);
  const ru = mode === 'code' ? OOB : redirectUri();
  LS.set('ytt.pending', {instance, ru});
  const q = {client_id:app.client_id, redirect_uri:ru, response_type:'code', scope:SCOPES, lang:'ko'};
  if (force) q.force_login = 'true';
  return `https://${instance}/oauth/authorize?` + new URLSearchParams(q);
}
async function finishLogin(code){
  const p = LS.get('ytt.pending', null);
  if (!p) throw new Error('로그인 정보가 없어요. 처음부터 다시 시도해 주세요.');
  const app = await getApp(p.instance);
  const tok = await postForm(`https://${p.instance}/oauth/token`, {grant_type:'authorization_code', code, client_id:app.client_id, client_secret:app.client_secret, redirect_uri:p.ru, scope:SCOPES});
  const tmp = {instance:p.instance, token:tok.access_token};
  const me = await api('/api/v1/accounts/verify_credentials', {acc:tmp});
  let domain = p.instance, max = 500;
  try{
    const j = await api('/api/v2/instance', {acc:tmp});
    domain = j.domain || domain; max = j.configuration?.statuses?.max_characters || max;
  }catch(e){
    try{ const j = await api('/api/v1/instance', {acc:tmp}); domain = (j.uri || domain).replace(/^https?:\/\//, ''); max = j.max_toot_chars || j.configuration?.statuses?.max_characters || max; }catch(e2){}
  }
  domain = domain.toLowerCase();
  const acc = {instance:p.instance, domain, max, token:tok.access_token, id:me.id, username:me.username,
    acct:`${me.username}@${domain}`, display_name:me.display_name, avatar:me.avatar, emojis:me.emojis || [], privacy:me.source?.privacy || 'public'};
  const i = accounts.findIndex(a => a.acct.toLowerCase() === acc.acct.toLowerCase());
  if (i >= 0) accounts[i] = acc; else accounts.push(acc);
  curIdx = i >= 0 ? i : accounts.length - 1;
  saveAccounts(); LS.del('ytt.pending');
  cache.clear(); curKey = null;
}

let lockCount = 0, lockY = 0;
function lockScroll(){
  if (lockCount++ > 0) return;
  lockY = window.scrollY;
  Object.assign(document.body.style, {position:'fixed', top:`-${lockY}px`, left:'0', right:'0', width:'100%'});
}
function unlockScroll(){
  if (lockCount === 0 || --lockCount > 0) return;
  Object.assign(document.body.style, {position:'', top:'', left:'', right:'', width:''});
  window.scrollTo(0, lockY);
}
/* 창(글쓰기·아래쪽 창·사진)이 열릴 때 뒤로가기 기록을 하나 남겨서, 뒤로가기를 누르면 앱이 꺼지지 않고 창만 닫히게 */
const ovStack = [];
let ovSeq = 0, ignorePop = 0;
const isDeadEntry = st => !!(st && st.ytt === 'ov' && !ovStack.some(o => o.id === st.id));
function pushOverlay(closeFn){
  const id = ++ovSeq;
  ovStack.push({id, closeFn});
  history.pushState({ytt:'ov', id, d:depthOf() + 1}, '');
  return id;
}
/* 버튼으로 창을 닫았을 때: 그 창이 남긴 뒤로가기 기록을 지움.
   닫자마자 다른 화면으로 넘어갔다면 지우지 않고, 나중에 뒤로가기로 지나갈 때 건너뜀 */
function overlayClosedByUI(id){
  const i = ovStack.findIndex(o => o.id === id);
  if (i < 0) return;
  ovStack.splice(i, 1);
  setTimeout(() => {
    if (!navAfterPop && history.state && history.state.ytt === 'ov' && history.state.id === id){ ignorePop++; history.back(); }
  }, 0);
}
window.addEventListener('popstate', e => {
  if (ignorePop > 0){ ignorePop--; return; }
  if (navAfterPop){ const f = navAfterPop; navAfterPop = null; f(); return; }
  if (ovStack.length){
    ovStack.pop().closeFn();
    if (isDeadEntry(e.state)){ ignorePop++; history.back(); }
    return;
  }
  if (isDeadEntry(e.state)) history.back();
});
function sheet(build){
  const ov = document.createElement('div'); ov.className = 'ov';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = '<div class="grab"></div>';
  ov.append(sh);
  let closed = false;
  const shut = () => { if (closed) return false; closed = true; ov.classList.add('out'); setTimeout(() => ov.remove(), 200); unlockScroll(); return true; };
  const id = pushOverlay(shut);
  const close = () => { if (shut()) overlayClosedByUI(id); };
  lockScroll();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  build(sh, close); document.body.append(ov); return close;
}
function optBtn(iconHtml, title, sub, checked){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
  b.innerHTML = `${iconHtml}<span class="t"><b></b><small></small></span>${checked ? `<span class="chk">${ic('check')}</span>` : ''}`;
  if (title instanceof Node) $('b', b).append(title); else $('b', b).textContent = title;
  $('small', b).textContent = sub; return b;
}
function accountPicker({title, selected, onPick, allowAdd=true}){
  sheet((sh, close) => {
    const h3 = document.createElement('h3'); h3.textContent = title; sh.append(h3);
    accounts.forEach((a, i) => {
      const b = optBtn('<img class="av" alt="">', richName(a), '@' + a.acct, i === selected);
      $('img', b).src = a.avatar;
      b.onclick = () => { close(); onPick(i); };
      sh.append(b);
    });
    if (allowAdd){
      const b = optBtn(`<span class="oi">${ic('plus')}</span>`, '계정 추가하기', '다른 캐릭터 계정으로도 로그인할 수 있어요', false);
      b.onclick = () => { close(); nav('#/login'); };
      sh.append(b);
    }
  });
}

    $('button', wr).onclick = e => { e.stopPropagation(); wr.replaceWith(el); };

async function toggleAct(st, kind, paint){
  const M = {fav:['favourited','favourite','unfavourite','favourites_count'], boost:['reblogged','reblog','unreblog','reblogs_count'], bm:['bookmarked','bookmark','unbookmark',null]}[kind];
  const was = !!st[M[0]];
  const apply = v => { st[M[0]] = v; if (M[3]) st[M[3]] = Math.max(0, (st[M[3]] || 0) + (v ? 1 : -1)); paint(); };
  apply(!was); syncStatus(st);
  try{
    const r = await api(`/api/v1/statuses/${st.id}/${was ? M[2] : M[1]}`, {method:'POST'});
    const fresh = r && (kind === 'boost' && !was && r.reblog ? r.reblog : r);
    if (fresh && fresh.id === st.id){ SYNC_KEYS.forEach(k => { if (k in fresh) st[k] = fresh[k]; }); paint(); syncStatus(st); }
    if (kind === 'bm') toast(was ? '북마크에서 뺐어요' : '북마크했어요');
  }catch(e){ apply(was); syncStatus(st); toast(e.message); }
}

/* 같은 툿이 떠 있는 모든 화면에서 새 내용으로 바꾸기 (수정한 뒤) */
function replaceStatusEverywhere(ns){
  const roots = new Set([...cache.values()].map(e => e.el)); roots.add($('#main'));
  const sel = `[data-sid="${CSS.escape(String(ns.id))}"]`;
  roots.forEach(r => r.querySelectorAll(sel).forEach(old => {
    if (!old.classList.contains('status')) return;
    const el = statusEl(ns, {focus:old.classList.contains('focus'), up:old.classList.contains('up'), chained:old.classList.contains('chained'), inThread:old.classList.contains('inthread')});
    if (!el.classList || !el.classList.contains('status')) return;
    const oldPre = old.firstElementChild && old.firstElementChild.classList.contains('pre') ? old.firstElementChild : null;
    if (oldPre){ const np = el.firstElementChild && el.firstElementChild.classList.contains('pre') ? el.firstElementChild : null; if (np) np.replaceWith(oldPre); else el.prepend(oldPre); }
    old.classList.forEach(c => { if (c !== 'has-quote') el.classList.add(c); });
    old.replaceWith(el);
  }));
}
async function editStatus(st, acc){
  let src = {text:plain(st.content), spoiler_text:st.spoiler_text || ''};
  try{ const r = await api(`/api/v1/statuses/${st.id}/source`, {acc}); if (r && r.text != null) src = r; }catch(e){}
  openCompose({edit:{acc, st, text:src.text, spoiler_text:src.spoiler_text || ''}});
}
function quoteStatus(st){
  const ap = st.quote_approval && st.quote_approval.current_user;
  if (ap === 'denied'){ toast('글쓴이가 이 툿은 인용할 수 없게 해 뒀어요'); return; }
  openCompose({quote:st});
}
async function toggleConvMute(st){
  try{
    const r = await api(`/api/v1/statuses/${st.id}/${st.muted ? 'unmute' : 'mute'}`, {method:'POST'});
    st.muted = !!(r && r.muted);
    toast(st.muted ? '이 대화 알림을 껐어요' : '이 대화 알림을 다시 받아요');
  }catch(e){ toast(e.message); }
}
/* 수정 기록 */
async function editHistory(st){
  let list;

  sheet(sh => {
    sh.classList.add('histsheet');
    sh.append(h('<h3>수정 기록</h3>'));
    (list || []).slice().reverse().forEach((v, i, arr) => {
      const box = h('<div class="hv"><div class="hvt"><b></b><span></span></div><div class="hvcw" hidden></div><div class="content"></div></div>');
      $('b', box).textContent = i === 0 ? '지금 내용' : i === arr.length - 1 ? '처음 쓴 글' : '수정 전';
      $('span', box).textContent = full(v.created_at);
      if (v.spoiler_text){ const c = $('.hvcw', box); c.hidden = false; c.textContent = '⚠ ' + v.spoiler_text; emojifyNode(c, v.emojis); }
      const c = $('.content', box); c.append(cleanHTML(v.content)); emojifyNode(c, v.emojis);
      if (v.media_attachments && v.media_attachments.length) box.append(h(`<div class="hvx">사진·영상 ${v.media_attachments.length}개</div>`));
      if (v.poll && v.poll.options) box.append(Object.assign(document.createElement('div'), {className:'hvx', textContent:'투표: ' + v.poll.options.map(o => o.title).join(' / ')}));
      sh.append(box);
    });
  });
}
/* 서버 커스텀 이모지 (서버마다 한 번만 불러옴) */
const emojiCache = new Map();
async function customEmojis(acc){
  if (emojiCache.has(acc.instance)) return emojiCache.get(acc.instance);
  const l = (await api('/api/v1/custom_emojis', {acc})) || [];
  const list = l.filter(e => e.visible_in_picker !== false)
    .sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.shortcode.localeCompare(b.shortcode));
  emojiCache.set(acc.instance, list);
  return list;
}
/* 신고하기 */
async function reportSheet(a, statuses = []){
  let rules = [];
  try{ rules = (await api('/api/v1/instance/rules')) || []; }catch(e){}
  const remote = a.acct.includes('@') ? a.acct.split('@')[1] : null;
  sheet((sh, close) => {
    sh.classList.add('repsheet');
    const t = document.createElement('h3'); t.textContent = `@${a.acct} 신고하기`; sh.append(t);
    sh.append(h(`<p class="secdesc" style="padding:0 20px 6px">${statuses.length ? '이 툿을' : '이 계정을'} 서버 관리자에게 알려요. 상대에게는 누가 신고했는지 알려지지 않아요.</p>`));
    let cat = 'spam'; const picked = new Set();
    const cats = [['spam','스팸·광고','원치 않는 홍보나 도배'], ...(rules.length ? [['violation','서버 규칙 위반','아래에서 어긴 규칙을 골라 주세요']] : []), ['other','그 밖의 문제','위에 없는 이유']];
    const cbox = document.createElement('div'), rbox = document.createElement('div'); rbox.className = 'rrules'; rbox.hidden = true;
    const paint = () => {
      cbox.replaceChildren();
      cats.forEach(([k, l, s]) => { const b = optBtn(`<span class="oi">${ic(k === 'spam' ? 'mail' : k === 'violation' ? 'warn' : 'flag')}</span>`, l, s, k === cat); b.onclick = () => { cat = k; paint(); }; cbox.append(b); });
      rbox.hidden = cat !== 'violation';
    };
    rules.forEach(r => {
      const l = h('<label class="rrule"><input type="checkbox"><span></span></label>');
      $('span', l).textContent = r.text; $('input', l).onchange = e => { if (e.target.checked) picked.add(r.id); else picked.delete(r.id); };
      rbox.append(l);
    });
    const ta = h('<textarea class="rcomment" maxlength="1000" placeholder="관리자에게 덧붙일 말 (안 써도 돼요)"></textarea>');

function mediaEl(list, blur){
  if (!list || !list.length) return null;

  const w = document.createElement('div'); w.className = 'media n' + Math.min(list.length, 4);

    const cell = document.createElement('div'); cell.className = 'mcell';

      const img = new Image(); img.src = m.preview_url || m.url; img.alt = m.description || ''; img.loading = 'lazy';
      img.onclick = e => { e.stopPropagation(); lightbox(list, i); };

    } else if (m.type === 'gifv'){

      if (m.type === 'video'){ v.playsInline = true; if (m.preview_url) v.poster = m.preview_url; }
      cell.append(v);
    } else {
      const a = document.createElement('a'); a.href = m.remote_url || m.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '첨부 파일 열기';

    cover.onclick = e => { e.stopPropagation(); w.classList.remove('blur'); cover.remove(); };
    w.append(cover);

}
function pollLeft(p){
  if (p.expired) return '마감됨';
  if (!p.expires_at) return '진행 중';
  const s = (new Date(p.expires_at) - Date.now()) / 1000;
  if (s <= 0) return '마감됨';
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + '분 남음';
  if (s < 86400) return Math.floor(s / 3600) + '시간 남음';
  return Math.floor(s / 86400) + '일 남음';
}
function pollEl(p, emojis, st){
  const w = document.createElement('div'); w.className = 'poll';
  w.addEventListener('click', e => e.stopPropagation());
  const own = st && ownerAcc(st);
  let showResults = !st || p.expired || p.voted || !!own;
  const draw = () => {
    w.replaceChildren();
    const voters = p.multiple ? (p.voters_count || p.votes_count) : p.votes_count;
    if (showResults){
      const mine = new Set((p.own_votes || []).map(Number));
      const most = Math.max(0, ...p.options.map(o => o.votes_count || 0));
      p.options.forEach((o, i) => {
        const pct = voters ? Math.round((o.votes_count || 0) / voters * 100) : 0;
        const row = h(`<div class="po${most && o.votes_count === most ? ' top' : ''}"><i style="width:${pct}%"></i><span class="pt"></span><span>${pct}%</span></div>`);
        const t = $('.pt', row); t.textContent = o.title; emojifyNode(t, emojis);
        if (mine.has(i)) t.insertAdjacentHTML('beforeend', ` <span class="pmine">${ic('check')}</span>`);
        w.append(row);
      });
    } else {
      const picked = new Set();
      p.options.forEach((o, i) => {
        const b = h(`<button class="pvo${p.multiple ? ' multi' : ''}" type="button"><span class="pbox"></span><span class="pt"></span></button>`);
        const t = $('.pt', b); t.textContent = o.title; emojifyNode(t, emojis);
        b.onclick = () => {
          if (p.multiple){ if (picked.has(i)) picked.delete(i); else picked.add(i); }
          else { picked.clear(); picked.add(i); }
          w.querySelectorAll('.pvo').forEach((x, j) => x.classList.toggle('on', picked.has(j)));
          vote.disabled = !picked.size;
        };
        w.append(b);
      });
      const bar = h('<div class="pvbar"><button class="pill" type="button" disabled>투표하기</button><button class="linkbtn" type="button">결과만 보기</button></div>');
      const [vote, peek] = bar.querySelectorAll('button');
      vote.onclick = async () => {
        vote.disabled = true; vote.textContent = '투표하는 중…';
        try{
          const r = await api(`/api/v1/polls/${p.id}/votes`, {method:'POST', body:{choices:[...picked].map(String)}});
          if (r) Object.assign(p, r);
          p.voted = true; showResults = true; draw(); toast('투표했어요');
        }catch(e){ toast(e.message); vote.disabled = false; vote.textContent = '투표하기'; }
      };
      peek.onclick = () => { showResults = true; draw(); };
      w.append(bar);
    }
    const meta = h(`<div class="pmeta">${voters || 0}명 참여 · ${pollLeft(p)}${p.multiple ? ' · 여러 개 선택' : ''}</div>`);
    if (showResults && !p.voted && !p.expired && st && !own){
      const back = h('<button class="linkbtn" type="button">투표하러 가기</button>');
      back.onclick = () => { showResults = false; draw(); };
      meta.append(' · ', back);
    }
    w.append(meta);
  };
  draw();
  return w;
}
function lightbox(list, i){
  const imgs = list.filter(m => m.type === 'image');
  let k = imgs.indexOf(list[i]); if (k < 0) return;
  const ov = document.createElement('div'); ov.className = 'lb';
  ov.innerHTML = `<img alt=""><button class="ibtn x" type="button" aria-label="닫기">${ic('x')}</button>${imgs.length > 1 ? `<button class="ibtn prev" type="button" aria-label="이전">${ic('left')}</button><button class="ibtn next" type="button" aria-label="다음">${ic('right')}</button>` : ''}<button class="altbtn" type="button" aria-label="사진 설명 보기" hidden>ALT</button><div class="altbox" hidden></div>`;
  const img = $('img', ov);
  const altBtn = $('.altbtn', ov), altBox = $('.altbox', ov);
  const show = () => {
    img.src = imgs[k].url;
    const d = (imgs[k].description || '').trim();
    altBox.textContent = d; altBox.hidden = true;
    altBtn.hidden = !d; altBtn.classList.remove('on');
  };
  altBtn.onclick = e => { e.stopPropagation(); altBox.hidden = !altBox.hidden; altBtn.classList.toggle('on', !altBox.hidden); };
  altBox.onclick = e => e.stopPropagation();
  show();
  let closed = false;
  const shut = () => { if (closed) return false; closed = true; ov.classList.add('out'); setTimeout(() => ov.remove(), 180); return true; };
  const id = pushOverlay(shut);
  const close = () => { if (shut()) overlayClosedByUI(id); };
  ov.onclick = e => { if (e.target === ov || e.target === img) close(); };
  $('.x', ov).onclick = close;
  if (imgs.length > 1){
    $('.prev', ov).onclick = e => { e.stopPropagation(); k = (k - 1 + imgs.length) % imgs.length; show(); };
    $('.next', ov).onclick = e => { e.stopPropagation(); k = (k + 1) % imgs.length; show(); };
  }
  document.body.append(ov);
}

/* ---------- 화면들 ---------- */
function feedView(endpoint, {params = {}, kind = 'status', empty = '아직 글이 없어요', hint = null, filter = null, limit = 20, linkOnly = false} = {}){
  const root = document.createElement('div');
  const hintKey = 'ytt.hint.' + endpoint + JSON.stringify(params);
  if (hint && !LS.get(hintKey, false)){
    const hb = h(`<div class="hint"><span></span><button class="ibtn" type="button" aria-label="안내 닫기">${ic('x')}</button></div>`);
    $('span', hb).textContent = hint;
    $('button', hb).onclick = () => { hb.remove(); LS.set(hintKey, true); };
    root.append(hb);
  }
  const list = document.createElement('div');
  const sent = document.createElement('div'); sent.className = 'sentinel';
  root.append(list, sent);
  let nextPath = null, loading = false, done = false, gen = 0, topSpin = null, topId = null;
  const seenIds = new Set();   /* 이미 보여 준 글은 다시 붙이지 않음 */
  const firstPath = () => endpoint + '?' + qs({limit:String(limit), ...params});
  /* 위쪽 '불러오는 중' 표시 (당겨서 새로고침 중이면 그 아이콘이 대신함) */
  const showSpin = () => { if (topSpin) return; topSpin = true; spinStart(); };
  const hideSpin = () => { if (!topSpin) return; topSpin = null; spinEnd(); };
  const bump = items => items.forEach(it => { if (!topId || cmpId(it.id, topId) > 0) topId = String(it.id); });
  /* 글 묶음 → 화면 조각 (연달아 있는 원글→답글은 원글을 위에 두고 선으로 이음) */
  const build = shown => {
    const frag = document.createDocumentFragment();
    if (kind === 'notif') shown.forEach(it => frag.append(notifEl(it)));
    else for (let i = 0; i < shown.length; ){
      let j = i;
      while (j + 1 < shown.length && !shown[j].reblog && !shown[j + 1].reblog && shown[j].in_reply_to_id && String(shown[j].in_reply_to_id) === String(shown[j + 1].id)) j++;
      for (let k = j; k >= i; k--) frag.append(statusEl(shown[k], {up:k > i, chained:k < j}));
      i = j + 1;
    }
    return frag;
  };
  async function load(reset){
    if (reset){ gen++; nextPath = null; done = false; loading = false; }
    if (loading || done) return;
    loading = true; const my = gen;
    const refreshing = reset && list.childElementCount > 0;
    if (refreshing) showSpin();
    else sent.innerHTML = '<div class="spin"></div>';
    let ok = false;
    try{
      const {data: items, next} = await api(nextPath && !reset ? nextPath : firstPath(), {withLink:true});
      if (my !== gen) return;
      if (reset){ list.replaceChildren(); seenIds.clear(); topId = null; }
      bump(items);
      const fresh = items.filter(it => !seenIds.has(String(it.id)));
      fresh.forEach(it => seenIds.add(String(it.id)));
      list.append(build(filter ? fresh.filter(filter) : fresh));
      /* 새 글이 하나도 없는 페이지 = 끝. 북마크·좋아요처럼 서버가 알려 준 다음 주소로만 넘길 수 있는 목록은 그 주소가 없으면 끝 */
      const nextGuess = next || (linkOnly ? null : endpoint + '?' + qs({limit:String(limit), ...params, max_id:items.length ? items[items.length - 1].id : ''}));
      if (fresh.length && nextGuess){
        nextPath = nextGuess;
        sent.innerHTML = ''; ok = true;
      }
      else { done = true; sent.innerHTML = list.childElementCount ? '<div class="end">여기까지 다 봤어요</div>' : `<div class="empty">${esc(empty)}</div>`; }
    }catch(e){
      if (my !== gen) return;
      if (refreshing) toast(e.message);
      sent.innerHTML = '';
      const b = h('<div class="err"><p></p><button class="pill ghost" type="button">다시 시도</button></div>');
      $('p', b).textContent = e.message; $('button', b).onclick = () => load(reset);
      sent.append(b);
    }finally{ if (my === gen){ loading = false; hideSpin(); } }

function threadOrder(focus, desc){
  const kids = new Map(), byId = new Map(desc.map(d => [String(d.id), d]));
  desc.forEach(d => { const p = String(d.in_reply_to_id); if (!kids.has(p)) kids.set(p, []); kids.get(p).push(d); });
  const out = [], seen = new Set();
  const walk = (id, author) => {
    const ch = (kids.get(String(id)) || []).slice().sort((a, b) => (String(b.account.id) === author) - (String(a.account.id) === author));
    ch.forEach(c => { if (seen.has(String(c.id))) return; seen.add(String(c.id)); out.push(c); walk(c.id, String(c.account.id)); });
  };
  walk(focus.id, String(focus.account.id));
  desc.forEach(d => { if (!seen.has(String(d.id))){ seen.add(String(d.id)); out.push(d); walk(d.id, String(d.account.id)); } });
  return out;
}

      if (ctx.ancestors.length && root.isConnected){
        const fit = () => {
          const want = parseFloat(getComputedStyle(f).scrollMarginTop) || 0;
          /* 아래 글이 짧아서 그 자리까지 못 올라가면 아래 빈칸을 늘림 */

    }catch(e){
      root.replaceChildren();
      const b = h('<div class="err" style="padding:32px 16px"><p></p><button class="pill ghost" type="button">다시 시도</button></div>');
      $('p', b).textContent = e.message; $('button', b).onclick = load;

      used++; pos += t.codePointAt(pos) > 0xffff ? 2 : 1;
    }
    return -1;
  };

      used += 23;
    } else {
      const r = run(m.index + m[1].length + m[2].length); if (r >= 0) return r;
    }

function stripMentionsDom(root){
  const node = root.firstElementChild && root.firstElementChild.tagName === 'P' ? root.firstElementChild : root;
  while (node.firstChild){
    const c = node.firstChild;
    if (c.nodeType === 3){
      const t = c.nodeValue.replace(/^(\s*@[\w.-]+(@[\w.-]+)?(?=\s|$))+\s*/, '').replace(/^\s+/, '');
      if (!t){ c.remove(); continue; }
      c.nodeValue = t; break;
    }
    if (c.nodeType === 1 && (c.matches('a.mention') || c.querySelector('a.mention')) && /^\s*@/.test(c.textContent)){ c.remove(); continue; }
    if (c.nodeType === 1 && c.tagName === 'BR'){ c.remove(); continue; }
